<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0EK0X213R9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-0EK0X213R9');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KU — Knowledge Universe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#e0e0e0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.universe{position:relative;width:600px;height:600px}
/* Portal */
.portal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#ffd700 0%,#ff8c00 40%,#0a0a12 80%);display:flex;align-items:center;justify-content:center;font-size:28px;z-index:10;box-shadow:0 0 30px rgba(255,215,0,.5);cursor:default}
.portal-label{position:absolute;left:50%;top:50%;transform:translate(-50%,52px);font-size:10px;color:#ffd700;text-transform:uppercase;letter-spacing:2px;white-space:nowrap;z-index:10}
/* Worlds */
.world{position:absolute;width:100px;height:100px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:default;transition:transform .3s,box-shadow .3s}
.world:hover{transform:scale(1.15);z-index:5}
.world .num{font-size:22px;line-height:1}
.world .name{font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-top:4px;opacity:.8}
/* Lines portal→world */
.line{position:absolute;left:300px;top:300px;height:1px;transform-origin:0 0;z-index:1}
.line-inner{width:100%;height:100%;background:linear-gradient(90deg,rgba(255,215,0,.6),rgba(255,255,255,.05))}
/* Clue arrows between worlds */
.clue{position:absolute;z-index:2;opacity:.25;font-size:8px;color:#aaa;pointer-events:none}
/* External import ring */
.ext-ring{position:absolute;left:50%;top:50%;width:560px;height:560px;border-radius:50%;border:1px dashed rgba(255,255,255,.08);transform:translate(-50%,-50%)}
.ext-label{position:absolute;right:20px;top:8px;font-size:8px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:1px}
/* Routing */
.routing-note{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);text-align:center;font-size:9px;color:rgba(255,255,255,.3);line-height:1.6;max-width:400px}
.routing-note span{color:#ffd700;font-weight:600}
/* Legend */
.legend{position:absolute;top:12px;left:12px;font-size:8px;color:rgba(255,255,255,.25);line-height:1.8}
.legend b{color:rgba(255,215,0,.5)}
</style>
</head>
<body>
<div class="universe" id="u">
  <div class="ext-ring"><div class="ext-label">← real world import</div></div>
  <div class="portal">🚪</div>
  <div class="portal-label">PORTAL</div>
  <div class="legend">
    <b>●</b> 7 worlds — become the character<br>
    <b>―</b> portal entry<br>
    <b>⤳</b> cross-world clues<br>
    <b>◌</b> external knowledge ring
  </div>
  <div class="routing-note">
    routing: <span>possessions</span> · <span>parcours</span> · <span>experience</span> → next world
  </div>
</div>
<script>
const worlds = [
  {n:1, color:'#e74c3c', glow:'rgba(231,76,60,.4)',  icon:'?'},
  {n:2, color:'#3498db', glow:'rgba(52,152,219,.4)', icon:'?'},
  {n:3, color:'#2ecc71', glow:'rgba(46,204,113,.4)', icon:'?'},
  {n:4, color:'#9b59b6', glow:'rgba(155,89,182,.4)', icon:'?'},
  {n:5, color:'#e67e22', glow:'rgba(230,126,34,.4)', icon:'?'},
  {n:6, color:'#1abc9c', glow:'rgba(26,188,156,.4)', icon:'?'},
  {n:7, color:'#f1c40f', glow:'rgba(241,196,15,.4)', icon:'?'}
];
const cx=300, cy=300, R=210;
const u=document.getElementById('u');

worlds.forEach((w,i)=>{
  const angle = -Math.PI/2 + (2*Math.PI*i/7);
  const wx = cx + R*Math.cos(angle);
  const wy = cy + R*Math.sin(angle);
  // Line from portal to world
  const dx=wx-cx, dy=wy-cy;
  const len=Math.sqrt(dx*dx+dy*dy);
  const deg=Math.atan2(dy,dx)*180/Math.PI;
  const line=document.createElement('div');
  line.className='line';
  line.style.width=len+'px';
  line.style.transform=`rotate(${deg}deg)`;
  line.innerHTML='<div class="line-inner"></div>';
  u.appendChild(line);
  // World node
  const d=document.createElement('div');
  d.className='world';
  d.style.left=(wx-50)+'px';
  d.style.top=(wy-50)+'px';
  d.style.background=`radial-gradient(circle,${w.color}33 0%,${w.color}11 70%)`;
  d.style.border=`1.5px solid ${w.color}66`;
  d.style.boxShadow=`0 0 20px ${w.glow}`;
  d.innerHTML=`<div class="num" style="color:${w.color}">${w.n}</div><div class="name">world ${w.n}</div>`;
  u.appendChild(d);
});
// A few cross-world clue hints
const cluePositions=[[0,3],[1,5],[2,6],[4,1],[5,2],[6,0]];
cluePositions.forEach(([a,b])=>{
  const angA=-Math.PI/2+(2*Math.PI*a/7);
  const angB=-Math.PI/2+(2*Math.PI*b/7);
  const mx=cx+(R*.55)*Math.cos((angA+angB)/2);
  const my=cy+(R*.55)*Math.sin((angA+angB)/2);
  const c=document.createElement('div');
  c.className='clue';
  c.style.left=mx+'px';
  c.style.top=my+'px';
  c.textContent='⤳';
  c.style.fontSize='14px';
  u.appendChild(c);
});
</script>
</body>
</html>
