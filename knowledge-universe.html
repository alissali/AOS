<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 KNOWLEDGE UNIVERSE — AOS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --gold: #c9a84c;
  --gold-glow: rgba(201,168,76,0.5);
  --deep: #0a0a1a;
  --panel: #111122;
  --sand: #d4a456;
  --spice: #e8923a;
  --void: #0d0d2b;
  --text: #e0d8c8;
  --dim: #888;
}

html, body { height:100%; overflow:hidden; background:var(--deep); color:var(--text); font-family:'Crimson Text',Georgia,serif; }

/* ═══════════════ SCREENS ═══════════════ */
.screen { position:absolute; inset:0; transition: opacity 0.8s, transform 0.8s; }
.screen.hidden { opacity:0; pointer-events:none; transform:scale(0.95); }
.screen.active { opacity:1; pointer-events:all; transform:scale(1); }

/* ═══════════════ PORTAL ═══════════════ */
#portal {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 50% 30%, #1a1040 0%, #0a0a1a 60%, #000 100%);
  overflow:hidden;
}
.portal-stars {
  position:absolute; inset:0; overflow:hidden;
}
.portal-stars .star {
  position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
  animation: twinkle var(--dur) infinite alternate;
}
@keyframes twinkle { 0%{opacity:0.2;} 100%{opacity:1;} }

.portal-title {
  font-family:'Cinzel',serif; font-size:clamp(2em,6vw,4.5em); font-weight:900;
  color:var(--gold); text-align:center; z-index:2;
  text-shadow: 0 0 40px var(--gold-glow), 0 0 80px rgba(201,168,76,0.2);
  animation: titlePulse 4s infinite alternate;
}
@keyframes titlePulse { 0%{text-shadow:0 0 40px var(--gold-glow);} 100%{text-shadow:0 0 80px var(--gold-glow), 0 0 120px rgba(201,168,76,0.15);} }
.portal-sub {
  font-size:clamp(0.9em,2vw,1.3em); color:var(--dim); margin-top:15px; z-index:2;
  font-style:italic; letter-spacing:2px;
}
.portal-enter {
  margin-top:50px; z-index:2; padding:18px 50px; font-family:'Cinzel',serif;
  font-size:1.2em; background:transparent; border:2px solid var(--gold); color:var(--gold);
  cursor:pointer; border-radius:4px; letter-spacing:3px; transition:all 0.4s;
}
.portal-enter:hover { background:var(--gold); color:#000; box-shadow:0 0 30px var(--gold-glow); }

.portal-ring {
  position:absolute; width:500px; height:500px; border:1px solid rgba(201,168,76,0.15);
  border-radius:50%; animation: ringRotate 60s linear infinite;
}
.portal-ring:nth-child(2) { width:600px; height:600px; animation-duration:90s; animation-direction:reverse; border-color:rgba(201,168,76,0.08); }
.portal-ring:nth-child(3) { width:400px; height:400px; animation-duration:45s; border-style:dashed; border-color:rgba(201,168,76,0.1); }
@keyframes ringRotate { to { transform:rotate(360deg); } }

/* ═══════════════ MAP ═══════════════ */
#map-screen {
  display:flex; flex-direction:column;
  background: radial-gradient(ellipse at 50% 50%, #1a1040 0%, #0d0d2b 50%, #000 100%);
  overflow:hidden;
}
.map-header {
  text-align:center; padding:15px; z-index:10;
  background:linear-gradient(to bottom, rgba(10,10,26,0.95), transparent);
}
.map-header h1 { font-family:'Cinzel',serif; font-size:1.5em; color:var(--gold); }
.map-header .subtitle { font-size:0.85em; color:var(--dim); margin-top:3px; }

.map-area { flex:1; position:relative; display:flex; align-items:center; justify-content:center; }

/* Orbital layout */
.map-center {
  position:absolute; width:80px; height:80px; border-radius:50%;
  background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
  animation: centerPulse 3s infinite alternate; z-index:5;
  display:flex; align-items:center; justify-content:center; font-size:2em;
}
@keyframes centerPulse { 0%{box-shadow:0 0 30px var(--gold-glow);} 100%{box-shadow:0 0 60px var(--gold-glow), 0 0 100px rgba(201,168,76,0.15);} }

.orbit-ring {
  position:absolute; border:1px dashed rgba(201,168,76,0.12); border-radius:50%;
  animation: ringRotate 120s linear infinite;
}

.world-node {
  position:absolute; width:110px; height:110px; border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; transition:all 0.4s; z-index:10;
  background: radial-gradient(circle, rgba(17,17,34,0.9) 0%, rgba(10,10,26,0.95) 100%);
  border:2px solid rgba(201,168,76,0.3);
}
.world-node:hover { transform:scale(1.15); border-color:var(--gold); box-shadow:0 0 25px var(--gold-glow); }
.world-node.active { border-color:var(--gold); box-shadow:0 0 20px var(--gold-glow); animation: nodePulse 2s infinite; }
.world-node.visited { border-color:#4caf50; }
.world-node.locked { opacity:0.35; cursor:default; }
.world-node .w-icon { font-size:2.2em; }
.world-node .w-name { font-family:'Cinzel',serif; font-size:0.65em; color:var(--sand); margin-top:5px; letter-spacing:1px; }
.world-node .w-status { font-size:0.55em; color:var(--dim); margin-top:2px; }
@keyframes nodePulse { 0%,100%{box-shadow:0 0 15px var(--gold-glow);} 50%{box-shadow:0 0 35px var(--gold-glow);} }

/* Connection lines — SVG */
.map-lines { position:absolute; inset:0; pointer-events:none; z-index:1; }

/* Player stats bar */
.player-bar {
  position:absolute; bottom:0; left:0; right:0; z-index:20;
  background:linear-gradient(to top, rgba(10,10,26,0.95), transparent);
  padding:10px 20px; display:flex; align-items:center; gap:15px;
  font-size:0.8em;
}
.player-bar .stat { display:flex; align-items:center; gap:5px; }
.player-bar .stat-val { color:var(--gold); font-weight:bold; }

/* Back button */
.back-btn {
  position:absolute; top:15px; left:15px; z-index:20;
  background:transparent; border:1px solid var(--gold); color:var(--gold);
  padding:8px 16px; font-family:'Cinzel',serif; font-size:0.8em;
  cursor:pointer; border-radius:4px; transition:all 0.3s; letter-spacing:1px;
}
.back-btn:hover { background:var(--gold); color:#000; }

/* ═══════════════ WORLD VIEW ═══════════════ */
#world-screen {
  display:grid; grid-template-rows:auto 1fr auto;
  background: var(--deep);
}
.world-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 20px; background:var(--panel); border-bottom:1px solid #333;
}
.world-header h2 { font-family:'Cinzel',serif; font-size:1.3em; color:var(--gold); }
.world-header .world-badge { font-size:0.75em; padding:4px 12px; border-radius:12px; background:rgba(201,168,76,0.15); color:var(--gold); }

.world-body { display:grid; grid-template-columns:1fr 320px; gap:0; overflow:hidden; }

/* Story panel */
.story-panel {
  display:flex; flex-direction:column; padding:30px; overflow-y:auto;
  background: linear-gradient(135deg, #0d0d2b 0%, #0a0a1a 100%);
}
.story-text {
  font-size:1.15em; line-height:1.8; color:var(--text); max-width:700px;
  animation: storyFade 0.6s ease-out;
}
@keyframes storyFade { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }

.story-choices {
  margin-top:30px; display:flex; flex-direction:column; gap:10px; max-width:700px;
}
.choice-btn {
  background:rgba(201,168,76,0.08); border:1px solid rgba(201,168,76,0.3);
  color:var(--text); padding:14px 20px; font-family:'Crimson Text',serif;
  font-size:1.05em; cursor:pointer; border-radius:6px; text-align:left;
  transition:all 0.3s; line-height:1.4;
}
.choice-btn:hover { background:rgba(201,168,76,0.15); border-color:var(--gold); color:var(--gold); transform:translateX(5px); }

.ending-box {
  margin-top:30px; padding:20px; border:2px solid var(--gold); border-radius:8px;
  background:rgba(201,168,76,0.05); text-align:center;
}
.ending-box h3 { font-family:'Cinzel',serif; color:var(--gold); font-size:1.4em; margin-bottom:10px; }
.ending-box .ending-facts { font-size:0.85em; color:var(--dim); margin-top:10px; }

/* Sidebar */
.world-sidebar {
  background:var(--panel); border-left:1px solid #333; padding:15px; overflow-y:auto;
  display:flex; flex-direction:column; gap:15px;
}
.sidebar-section h3 { font-family:'Cinzel',serif; font-size:0.85em; color:var(--gold); margin-bottom:8px; border-bottom:1px solid #222; padding-bottom:5px; }
.fact-tag {
  display:inline-block; background:rgba(76,175,80,0.15); border:1px solid rgba(76,175,80,0.3);
  color:#81c784; padding:3px 8px; border-radius:12px; font-size:0.75em; margin:2px;
}
.snake-indicator {
  padding:8px 12px; border-radius:6px; font-size:0.8em; display:flex; align-items:center; gap:8px;
}
.snake-indicator.static { background:rgba(255,193,7,0.1); border:1px solid rgba(255,193,7,0.3); color:#ffc107; }
.snake-indicator.dynamic { background:rgba(244,67,54,0.1); border:1px solid rgba(244,67,54,0.3); color:#f44336; }

.node-id { font-size:0.7em; color:var(--dim); font-family:monospace; }

.game-link-btn {
  display:block; width:100%; padding:12px; text-align:center; text-decoration:none;
  font-family:'Cinzel',serif; font-size:0.9em; color:var(--gold); border:1px solid var(--gold);
  border-radius:6px; transition:all 0.3s; margin-top:5px;
}
.game-link-btn:hover { background:var(--gold); color:#000; }

/* World teaser (for worlds without stories yet) */
.teaser-panel {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:40px;
}
.teaser-icon { font-size:5em; margin-bottom:20px; }
.teaser-title { font-family:'Cinzel',serif; font-size:1.8em; color:var(--gold); margin-bottom:10px; }
.teaser-desc { font-size:1.1em; color:var(--dim); max-width:500px; line-height:1.6; margin-bottom:30px; }
.teaser-play-btn {
  display:inline-block; padding:15px 40px; font-family:'Cinzel',serif; font-size:1.1em;
  color:var(--gold); border:2px solid var(--gold); border-radius:6px; text-decoration:none;
  transition:all 0.3s; letter-spacing:2px;
}
.teaser-play-btn:hover { background:var(--gold); color:#000; box-shadow:0 0 30px var(--gold-glow); }

/* TRAIN overlay */
#train-overlay {
  position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.92);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition: opacity 0.5s;
}
#train-overlay.hidden { opacity:0; pointer-events:none; }
.train-animation {
  font-size:4em; animation: trainMove 2s ease-in-out;
}
@keyframes trainMove {
  0% { transform:translateX(-200px); opacity:0; }
  30% { transform:translateX(0); opacity:1; }
  70% { transform:translateX(0); opacity:1; }
  100% { transform:translateX(200px); opacity:0; }
}
.train-text { font-family:'Cinzel',serif; color:var(--gold); font-size:1.2em; margin-top:20px; letter-spacing:3px; }

/* Footer */
.world-footer {
  padding:8px 20px; background:var(--panel); border-top:1px solid #333;
  display:flex; justify-content:space-between; align-items:center; font-size:0.75em; color:var(--dim);
}

/* Responsive */
@media (max-width:768px) {
  .world-body { grid-template-columns:1fr; }
  .world-sidebar { border-left:none; border-top:1px solid #333; max-height:200px; }
  .world-node { width:80px; height:80px; }
  .world-node .w-icon { font-size:1.6em; }
  .world-node .w-name { font-size:0.55em; }
  .story-panel { padding:15px; }
}

/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--deep); }
::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#555; }
</style>
</head>

<div id="train-overlay" class="hidden">

</div>

<script>
// ═══════════════ DATA ═══════════════

    game:'dune-deckbuilder.html', gameName:'Ring of the Desert', angle:0 },

// ═══════════════ STATE ═══════════════
let state = loadState();

function defaultState() {
  return {
    currentWorld: null,
    currentNode: 'SL-001',
    facts: [],
    visited: [],
    snakesMet: 0,
    ending: null,
    history: []
  };
}

function loadState() {
  try {
    const s = localStorage.getItem('ku-state');
    return s ? JSON.parse(s) : defaultState();
  } catch(e) { return defaultState(); }
}

function saveState() { localStorage.setItem('ku-state', JSON.stringify(state)); }

// ═══════════════ PORTAL ═══════════════
function generateStars() {
  const c = document.getElementById('stars');
  for(let i = 0; i < 200; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.setProperty('--dur', (1+Math.random()*3)+'s');
    s.style.width = s.style.height = (1+Math.random()*2)+'px';
    c.appendChild(s);
  }
}
generateStars();

function switchScreen(from, to) {
  document.getElementById(from).classList.remove('active');
  document.getElementById(from).classList.add('hidden');
  document.getElementById(to).classList.remove('hidden');
  document.getElementById(to).classList.add('active');
}

function enterMap() { switchScreen('portal','map-screen'); renderMap(); }

// ═══════════════ MAP ═══════════════
function renderMap() {
  const area = document.getElementById('mapArea');
  // Remove old nodes
  area.querySelectorAll('.world-node, .orbit-ring').forEach(n=>n.remove());

  const cx = area.offsetWidth/2;
  const cy = area.offsetHeight/2;
  const radius = Math.min(cx,cy) * 0.65;

  // Orbit rings
  [0.4,0.65,0.9].forEach(r => {
    const ring = document.createElement('div');
    ring.className = 'orbit-ring';
    const size = Math.min(cx,cy)*2*r;
    ring.style.width = ring.style.height = size+'px';
    ring.style.left = (cx - size/2)+'px';
    ring.style.top = (cy - size/2)+'px';
    area.appendChild(ring);
  });

  // Draw connection lines
  const svg = document.getElementById('mapLines');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${area.offsetWidth} ${area.offsetHeight}`);

  const positions = [];
  WORLDS.forEach((w,i) => {
    const ang = (w.angle - 90) * Math.PI / 180;
    const x = cx + radius * Math.cos(ang);
    const y = cy + radius * Math.sin(ang);
    positions.push({x,y});
  });

  // Lines from center to each world
  positions.forEach((p,i) => {
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',cx); line.setAttribute('y1',cy);
    line.setAttribute('x2',p.x); line.setAttribute('y2',p.y);
    const visited = state.visited.includes(WORLDS[i].id);
    line.setAttribute('stroke', visited ? 'rgba(201,168,76,0.3)' : 'rgba(201,168,76,0.08)');
    line.setAttribute('stroke-width', visited ? '2' : '1');
    line.setAttribute('stroke-dasharray', visited ? 'none' : '5,5');
    svg.appendChild(line);
  });

  // Circular connections between adjacent worlds
  for(let i = 0; i < positions.length; i++) {
    const j = (i+1)%positions.length;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',positions[i].x); line.setAttribute('y1',positions[i].y);
    line.setAttribute('x2',positions[j].x); line.setAttribute('y2',positions[j].y);
    line.setAttribute('stroke','rgba(201,168,76,0.06)');
    line.setAttribute('stroke-width','1');
    line.setAttribute('stroke-dasharray','3,8');
    svg.appendChild(line);
  }

  // Place world nodes
  WORLDS.forEach((w,i) => {
    const node = document.createElement('div');
    node.className = 'world-node';
    if(state.visited.includes(w.id)) node.classList.add('visited');
    if(state.currentWorld === w.id) node.classList.add('active');

    node.innerHTML = `
      <div class="w-icon">${w.icon}</div>
      <div class="w-name">${w.name}</div>
      <div class="w-status">${w.hasStory ? '📖 Story' : '🎴 Game'}</div>
    `;
    node.style.left = (positions[i].x - 55)+'px';
    node.style.top = (positions[i].y - 55)+'px';
    node.onclick = () => travelTo(w.id);
    area.appendChild(node);
  });

  updateStats();
}

function updateStats() {
  document.getElementById('statWorld').textContent = state.currentWorld ? WORLDS.find(w=>w.id===state.currentWorld).name : '—';
  document.getElementById('statFacts').textContent = state.facts.length;
  document.getElementById('statVisited').textContent = state.visited.length;
  document.getElementById('statSnakes').textContent = state.snakesMet;
}

// ═══════════════ TRAVEL ═══════════════
function travelTo(worldId) {
  const world = WORLDS.find(w=>w.id===worldId);
  const overlay = document.getElementById('train-overlay');
  const trainText = document.getElementById('trainText');

  trainText.textContent = `Traveling to ${world.name}...`;
  overlay.classList.remove('hidden');

  setTimeout(() => {
    overlay.classList.add('hidden');
    state.currentWorld = worldId;
    if(!state.visited.includes(worldId)) state.visited.push(worldId);
    if(worldId === 'arrakis' && !state.ending) {
      // Continue story from where we left off
    } else if(worldId !== 'arrakis') {
      // Reset node for non-arrakis worlds
    }
    saveState();
    enterWorld(worldId);
  }, 2000);
}

// ═══════════════ WORLD VIEW ═══════════════
function enterWorld(worldId) {
  const world = WORLDS.find(w=>w.id===worldId);
  document.getElementById('worldTitle').textContent = `${world.icon} ${world.name}`;
  document.getElementById('worldBadge').textContent = world.hasStory ? '📖 STORY MODE' : '🎴 GAME MODE';

  if(world.hasStory && worldId === 'arrakis') {
    renderArrakisStory();
  } else {
    renderWorldTeaser(world);
  }

  switchScreen('map-screen','world-screen');
}

function backToMap() {
  switchScreen('world-screen','map-screen');
  renderMap();
}

// ═══════════════ ARRAKIS STORY ENGINE ═══════════════
function getNode(id) { return ARRAKIS_STORY.find(n => n.id === id); }

function renderArrakisStory() {
  const node = getNode(state.currentNode);
  if(!node) { state.currentNode = 'SL-001'; saveState(); renderArrakisStory(); return; }

  const storyPanel = document.getElementById('storyPanel');
  const sidebar = document.getElementById('worldSidebar');

  // Check if ending
  const isEnding = node.id.startsWith('END-');

  let html = `<div class="story-text">${node.text}</div>`;

  if(node.snake) {
    html += `<div class="snake-indicator ${node.snake}" style="margin-top:20px;">
      🐍 ${node.snake === 'static' ? 'STATIC SNAKE — Tests your memory. Same every time.' : 'DYNAMIC SNAKE — Reacts to your choices. "You have been weighed."'}
    </div>`;
  }

  if(isEnding) {
    const endingNames = { prophet:'👁️ PROPHET', wanderer:'🚶 WANDERER', ghost:'👻 GHOST', vessel:'🏺 VESSEL' };
    const endName = endingNames[node.ending] || node.ending;
    html += `<div class="ending-box">
      <h3>AWAKENING: ${endName}</h3>
      <p style="color:var(--sand);margin-top:8px;">You have walked your path through Arrakis.</p>
      ${node.facts_granted ? `<div class="ending-facts">Granted: ${node.facts_granted.map(f=>`<span class="fact-tag">${f}</span>`).join(' ')}</div>` : ''}
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="choice-btn" style="max-width:250px;text-align:center;" onclick="restartArrakis()">↺ Walk Again</button>
        <button class="choice-btn" style="max-width:250px;text-align:center;" onclick="backToMap()">← Return to Map</button>
      </div>
    </div>`;
    state.ending = node.ending;
    if(node.facts_granted) node.facts_granted.forEach(f => { if(!state.facts.includes(f)) state.facts.push(f); });
    saveState();
  } else {
    html += `<div class="story-choices">`;
    node.choices.forEach(c => {
      html += `<button class="choice-btn" onclick="makeChoice('${c.next}','${c.fact}')">${c.label}</button>`;
    });
    html += `</div>`;
  }

  storyPanel.innerHTML = html;

  // Sidebar
  let sideHtml = '';

  // Node info
  sideHtml += `<div class="sidebar-section">
    <h3>📍 Current Node</h3>
    <div class="node-id">${node.id}</div>
  </div>`;

  // Facts collected
  sideHtml += `<div class="sidebar-section">
    <h3>📦 Facts Collected (${state.facts.length})</h3>
    <div>${state.facts.length ? state.facts.map(f=>`<span class="fact-tag">${f}</span>`).join(' ') : '<span style="color:var(--dim);font-size:0.8em;">None yet</span>'}</div>
  </div>`;

  // Path history
  sideHtml += `<div class="sidebar-section">
    <h3>🛤️ Path Walked</h3>
    <div style="font-size:0.75em;color:var(--dim);">${state.history.length ? state.history.join(' → ') : 'Journey begins...'}</div>
  </div>`;

  // Game link
  sideHtml += `<div class="sidebar-section">
    <h3>🎴 Play the Game</h3>
    <a href="https://juxaos.com/dune-deckbuilder.html" target="_blank" class="game-link-btn">🏜️ Ring of the Desert</a>
    <a href="https://juxaos.com/dune-tarot.html" target="_blank" class="game-link-btn" style="margin-top:8px;">🃏 The Spice Oracle</a>
  </div>`;

  // Worlds visited
  sideHtml += `<div class="sidebar-section">
    <h3>🌍 Worlds Visited</h3>
    <div>${WORLDS.map(w => `<span style="opacity:${state.visited.includes(w.id)?1:0.3};margin-right:8px;" title="${w.name}">${w.icon}</span>`).join('')}</div>
  </div>`;

  sidebar.innerHTML = sideHtml;

  // Footer
  document.getElementById('footerNode').textContent = node.id;
  document.getElementById('footerEnding').textContent = state.ending ? `Awakening: ${state.ending.toUpperCase()}` : 'Walking...';
}

function makeChoice(nextId, fact) {
  if(fact && !state.facts.includes(fact)) state.facts.push(fact);
  state.history.push(state.currentNode);
  state.currentNode = nextId;

  const node = getNode(state.currentNode);
  if(node && node.snake) state.snakesMet++;

  saveState();
  renderArrakisStory();
  document.querySelector('.story-panel').scrollTo(0,0);
}

function restartArrakis() {
  // Keep facts and visited, reset story position
  state.currentNode = 'SL-001';
  state.ending = null;
  state.history = [];
  saveState();
  renderArrakisStory();
}

    <div class="sidebar-section">
      <h3>🎴 Game</h3>
      <a href="https://juxaos.com/${world.game}" target="_blank" class="game-link-btn">${world.icon} ${world.gameName}</a>
    </div>
  `;
  sidebar.innerHTML = sideHtml;
  document.getElementById('footerNode').textContent = world.id;
  document.getElementById('footerEnding').textContent = '—';
}

// ═══════════════ RESET ═══════════════
function resetGame() {
  if(confirm('Reset all progress? Facts, visited worlds, story position — everything.')) {
    state = defaultState();
    saveState();
    renderMap();
  }
}

// ═══════════════ RESIZE ═══════════════
window.addEventListener('resize', () => {
  if(document.getElementById('map-screen').classList.contains('active')) renderMap();
});

// Auto-resume
if(state.currentWorld || state.visited.length > 0) {
  // Player has been here before — skip portal
  // Actually, always show portal for the cinematic feel
}
</script>
</body>
</html>
