<title>Silver Ship — The Game | AOS</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    font-family: 'Courier New', monospace;
    color: #c0c0c0;
    overflow: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── NAV BAR ── */
  .game-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    background: rgba(0,51,51,0.95);
    border-bottom: 1px solid rgba(74,158,255,0.3);
    z-index: 100;
    flex-shrink: 0;
  }
  .game-nav a {
    color: #c0c0c0;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
  }
  .game-nav a:hover { color: #4a9eff; }
  .game-nav .logo {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 2px;
  }
  .game-nav .logo span { color: #4a9eff; }
  .game-nav .nav-links {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .game-nav .nav-links a.active { color: #4a9eff; }
  .game-nav .buy-btn {
    background: linear-gradient(135deg, #4a9eff, #0066cc);
    color: #fff !important;
    padding: 5px 14px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
  }
  .game-nav .buy-btn:hover { opacity: 0.9; }

  /* ── GAME AREA ── */
  #game-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #game-container {
    position: relative;
    border: 1px solid rgba(74,158,255,0.3);
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(74,158,255,0.1);
  }
  canvas { display: block; }

  /* ── MOBILE TOUCH CONTROLS ── */
  .touch-controls {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px 20px 20px;
    z-index: 50;
    pointer-events: none;
  }
  .touch-controls-inner {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    max-width: 600px;
    margin: 0 auto;
  }

  /* D-PAD */
  .dpad {
    display: grid;
    grid-template: 
      ". up ."
      "left center right"
      ". down .";
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 4px;
    pointer-events: auto;
  }
  .dpad-btn {
    background: rgba(74,158,255,0.2);
    border: 1px solid rgba(74,158,255,0.4);
    border-radius: 8px;
    color: #4a9eff;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .dpad-btn:active, .dpad-btn.pressed {
    background: rgba(74,158,255,0.5);
    box-shadow: 0 0 15px rgba(74,158,255,0.4);
  }
  .dpad-btn.up { grid-area: up; }
  .dpad-btn.down { grid-area: down; }
  .dpad-btn.left { grid-area: left; }
  .dpad-btn.right { grid-area: right; }
  .dpad-center { grid-area: center; }

  /* ACTION BUTTONS */
  .action-btns {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    pointer-events: auto;
  }
  .fire-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,100,0,0.25);
    border: 2px solid rgba(255,140,0,0.5);
    color: #ff8c00;
    font-size: 13px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .fire-btn:active, .fire-btn.pressed {
    background: rgba(255,100,0,0.5);
    box-shadow: 0 0 20px rgba(255,140,0,0.5);
  }
  .enter-btn {
    width: 64px;
    height: 40px;
    border-radius: 6px;
    background: rgba(74,158,255,0.2);
    border: 1px solid rgba(74,158,255,0.4);
    color: #4a9eff;
    font-size: 11px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .enter-btn:active, .enter-btn.pressed {
    background: rgba(74,158,255,0.5);
  }

  /* MOBILE */
  @media (max-width: 768px), (hover: none) and (pointer: coarse) {
    .touch-controls { display: block; }
    .game-nav .nav-links .hide-mobile { display: none; }
    .game-nav { padding: 6px 12px; }
    .game-nav .logo { font-size: 16px; }
    #game-wrapper { align-items: flex-start; padding-top: 5px; }
  }
  @media (max-width: 480px) {
    .dpad {
      grid-template-columns: 48px 48px 48px;
      grid-template-rows: 48px 48px 48px;
    }
    .fire-btn { width: 66px; height: 66px; font-size: 11px; }
  }
</style>
