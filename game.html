<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silver Ship — The Game | AOS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #c0c0c0;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    border: 1px solid rgba(74,158,255,0.3);
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(74,158,255,0.1);
  }
  canvas { display: block; }
</style>
</head>
<body>

<div id="game-container"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════
// SILVER SHIP — THE GAME
// Fly the Silver Ship over Arrakis. Collect spice.
// Dodge sandworms. Reach the twin suns.
// ═══════════════════════════════════════════════════════

const W = 960;
const H = 540;

// ─── BOOT SCENE ───
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }

  create() {
    // Generate all textures procedurally
    this.generateTextures();
    this.scene.start('Menu');
  }

  generateTextures() {
    // ── SILVER SHIP ──
    const shipG = this.make.graphics({ add: false });
    // Main hull — sleek silver
    shipG.fillStyle(0xc0c0c0, 1);
    shipG.beginPath();
    shipG.moveTo(60, 20);  // nose
    shipG.lineTo(45, 8);
    shipG.lineTo(10, 5);   // top wing tip
    shipG.lineTo(5, 18);
    shipG.lineTo(0, 20);   // rear top
    shipG.lineTo(0, 22);   // rear bottom
    shipG.lineTo(5, 24);
    shipG.lineTo(10, 37);  // bottom wing tip
    shipG.lineTo(45, 34);
    shipG.lineTo(60, 22);  // nose bottom
    shipG.closePath();
    shipG.fillPath();
    // Cockpit glow
    shipG.fillStyle(0x4a9eff, 0.9);
    shipG.fillEllipse(48, 21, 10, 5);
    // Engine glow
    shipG.fillStyle(0x4a9eff, 0.7);
    shipG.fillRect(0, 17, 4, 8);
    shipG.fillStyle(0x00ffff, 0.4);
    shipG.fillRect(-3, 18, 4, 6);
    // Wing detail lines
    shipG.lineStyle(1, 0x4a9eff, 0.3);
    shipG.lineBetween(15, 10, 50, 18);
    shipG.lineBetween(15, 32, 50, 24);
    shipG.generateTexture('ship', 64, 42);
    shipG.destroy();

    // ── SANDWORM ──
    const wormG = this.make.graphics({ add: false });
    for (let i = 0; i < 8; i++) {
      const x = i * 18;
      const yOff = Math.sin(i * 0.8) * 6;
      const radius = 14 - i * 0.5;
      wormG.fillStyle(0xc4956a, 1);
      wormG.fillCircle(x + 14, 20 + yOff, radius);
      wormG.fillStyle(0xa07850, 1);
      wormG.fillCircle(x + 14, 20 + yOff, radius - 3);
    }
    // Mouth
    wormG.fillStyle(0x602020, 1);
    wormG.fillCircle(10, 20, 10);
    wormG.fillStyle(0x801010, 1);
    wormG.fillCircle(10, 20, 6);
    // Teeth
    wormG.fillStyle(0xe0d0b0, 1);
    for (let a = 0; a < 6; a++) {
      const angle = (a / 6) * Math.PI * 2;
      wormG.fillRect(10 + Math.cos(angle) * 7, 20 + Math.sin(angle) * 7, 2, 2);
    }
    wormG.generateTexture('worm', 160, 44);
    wormG.destroy();

    // ── SPICE PARTICLE ──
    const spiceG = this.make.graphics({ add: false });
    spiceG.fillStyle(0xff8c00, 1);
    spiceG.fillCircle(8, 8, 6);
    spiceG.fillStyle(0xffaa33, 0.8);
    spiceG.fillCircle(8, 8, 4);
    spiceG.fillStyle(0xffcc66, 0.5);
    spiceG.fillCircle(7, 7, 2);
    spiceG.generateTexture('spice', 16, 16);
    spiceG.destroy();

    // ── ROCK ──
    const rockG = this.make.graphics({ add: false });
    rockG.fillStyle(0x554433, 1);
    rockG.beginPath();
    rockG.moveTo(20, 0);
    rockG.lineTo(35, 8);
    rockG.lineTo(40, 25);
    rockG.lineTo(30, 38);
    rockG.lineTo(10, 40);
    rockG.lineTo(0, 28);
    rockG.lineTo(5, 10);
    rockG.closePath();
    rockG.fillPath();
    rockG.fillStyle(0x665544, 0.6);
    rockG.fillTriangle(20, 2, 33, 10, 15, 15);
    rockG.generateTexture('rock', 40, 40);
    rockG.destroy();

    // ── STAR ──
    const starG = this.make.graphics({ add: false });
    starG.fillStyle(0xffffff, 1);
    starG.fillCircle(2, 2, 2);
    starG.generateTexture('star', 4, 4);
    starG.destroy();

    // ── SUN ──
    const sunG = this.make.graphics({ add: false });
    sunG.fillStyle(0xff6600, 0.15);
    sunG.fillCircle(30, 30, 30);
    sunG.fillStyle(0xff8800, 0.3);
    sunG.fillCircle(30, 30, 22);
    sunG.fillStyle(0xffaa00, 0.6);
    sunG.fillCircle(30, 30, 15);
    sunG.fillStyle(0xffcc44, 0.9);
    sunG.fillCircle(30, 30, 10);
    sunG.generateTexture('sun', 60, 60);
    sunG.destroy();

    // ── EXPLOSION PARTICLE ──
    const expG = this.make.graphics({ add: false });
    expG.fillStyle(0xff4400, 1);
    expG.fillCircle(4, 4, 4);
    expG.generateTexture('explosion', 8, 8);
    expG.destroy();

    // ── SHIELD PARTICLE ──
    const shG = this.make.graphics({ add: false });
    shG.fillStyle(0x4a9eff, 0.6);
    shG.fillCircle(3, 3, 3);
    shG.generateTexture('shield_particle', 6, 6);
    shG.destroy();

    // ── BULLET ──
    const bulG = this.make.graphics({ add: false });
    bulG.fillStyle(0x4a9eff, 1);
    bulG.fillRect(0, 1, 12, 2);
    bulG.fillStyle(0x00ffff, 0.7);
    bulG.fillRect(8, 0, 6, 4);
    bulG.generateTexture('bullet', 14, 4);
    bulG.destroy();
  }
}

// ─── MENU SCENE ───
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }

  create() {
    // Stars background
    for (let i = 0; i < 80; i++) {
      const s = this.add.image(
        Phaser.Math.Between(0, W),
        Phaser.Math.Between(0, H * 0.55),
        'star'
      );
      s.setAlpha(Phaser.Math.FloatBetween(0.2, 0.8));
      s.setScale(Phaser.Math.FloatBetween(0.3, 1.2));
    }

    // Twin suns
    this.add.image(W * 0.7, 80, 'sun').setScale(1.5).setAlpha(0.7);
    this.add.image(W * 0.78, 95, 'sun').setScale(1).setAlpha(0.5);

    // Desert floor
    const dg = this.add.graphics();
    dg.fillGradientStyle(0x8b6914, 0x8b6914, 0x5c4a1e, 0x5c4a1e, 1);
    dg.fillRect(0, H * 0.6, W, H * 0.4);
    // Dune lines
    dg.lineStyle(1, 0x9b7924, 0.3);
    for (let i = 0; i < 12; i++) {
      const y = H * 0.6 + i * 18;
      dg.beginPath();
      dg.moveTo(0, y);
      for (let x = 0; x < W; x += 20) {
        dg.lineTo(x, y + Math.sin(x * 0.01 + i) * 5);
      }
      dg.strokePath();
    }

    // Title
    this.add.text(W / 2, H * 0.18, 'SILVER SHIP', {
      fontFamily: 'Courier New',
      fontSize: '52px',
      fontStyle: 'bold',
      color: '#c0c0c0',
      stroke: '#4a9eff',
      strokeThickness: 1,
      shadow: { offsetX: 0, offsetY: 0, color: '#4a9eff', blur: 20, fill: true }
    }).setOrigin(0.5);

    this.add.text(W / 2, H * 0.28, 'T H E   G A M E', {
      fontFamily: 'Courier New',
      fontSize: '18px',
      color: '#4a9eff',
      letterSpacing: 8
    }).setOrigin(0.5);

    // Ship preview — floating
    this.ship = this.add.image(W / 2, H * 0.45, 'ship').setScale(3);
    this.shipBaseY = H * 0.45;

    // Instructions
    this.add.text(W / 2, H * 0.65, '[ ARROW KEYS — Move ]   [ SPACE — Fire ]', {
      fontFamily: 'Courier New', fontSize: '14px', color: '#888'
    }).setOrigin(0.5);

    this.add.text(W / 2, H * 0.72, 'Collect spice ● Dodge worms ● Reach the twin suns', {
      fontFamily: 'Courier New', fontSize: '13px', color: '#666'
    }).setOrigin(0.5);

    // Start prompt
    this.startText = this.add.text(W / 2, H * 0.85, '▶  PRESS ENTER TO FLY  ◀', {
      fontFamily: 'Courier New', fontSize: '20px', color: '#4a9eff',
      shadow: { offsetX: 0, offsetY: 0, color: '#4a9eff', blur: 15, fill: true }
    }).setOrigin(0.5);

    // Blink
    this.tweens.add({
      targets: this.startText,
      alpha: 0.3,
      duration: 800,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    });

    // Footer
    this.add.text(W / 2, H - 15, 'AOS × JuXITT — See. Understand. Cruise.', {
      fontFamily: 'Courier New', fontSize: '10px', color: '#444'
    }).setOrigin(0.5);

    // Input
    this.input.keyboard.on('keydown-ENTER', () => {
      this.cameras.main.fadeOut(500, 0, 0, 0);
      this.time.delayedCall(500, () => this.scene.start('Game'));
    });

    this.cameras.main.fadeIn(800, 0, 0, 0);
  }

  update(time) {
    // Floating ship
    this.ship.y = this.shipBaseY + Math.sin(time * 0.002) * 8;
  }
}

// ─── GAME SCENE ───
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  create() {
    this.score = 0;
    this.spiceCollected = 0;
    this.distance = 0;
    this.gameSpeed = 2;
    this.level = 1;
    this.levelNames = [
      'I — CRUISE',
      'II — TURN AROUND',
      'III — RAIN ON ARRAKIS',
      'IV — UP & LANDING',
      'V — END OF TIME',
      'VI — MIDDLE OF THE HEART',
      'VII — BURNING WOUND',
      'VIII — FEET ON THE GROUND',
      'IX — IRULAN MADE ME LAUGH'
    ];
    this.levelThresholds = [0, 500, 1200, 2000, 3000, 4200, 5600, 7200, 9000];
    this.shieldHP = 3;
    this.isInvincible = false;
    this.gameOver = false;

    // ── BACKGROUND LAYERS ──
    // Sky gradient
    const skyG = this.add.graphics();
    skyG.fillGradientStyle(0x000011, 0x000011, 0x001a2a, 0x001a2a, 1);
    skyG.fillRect(0, 0, W, H * 0.65);
    skyG.setScrollFactor(0);

    // Stars (parallax layer 1)
    this.stars = [];
    for (let i = 0; i < 100; i++) {
      const s = this.add.image(
        Phaser.Math.Between(0, W),
        Phaser.Math.Between(0, H * 0.55),
        'star'
      );
      s.setAlpha(Phaser.Math.FloatBetween(0.15, 0.7));
      s.setScale(Phaser.Math.FloatBetween(0.3, 1));
      s.speed = Phaser.Math.FloatBetween(0.1, 0.4);
      this.stars.push(s);
    }

    // Twin suns
    this.sun1 = this.add.image(W * 0.82, 65, 'sun').setScale(1.8).setAlpha(0.6);
    this.sun2 = this.add.image(W * 0.88, 85, 'sun').setScale(1.2).setAlpha(0.4);

    // Desert (parallax layer 2)
    this.desertG = this.add.graphics();
    this.drawDesert(0);
    this.desertOffset = 0;

    // ── SHIP ──
    this.ship = this.physics.add.image(120, H * 0.4, 'ship');
    this.ship.setScale(1.8);
    this.ship.setCollideWorldBounds(true);
    this.ship.setDepth(10);
    this.ship.body.setSize(50, 20);
    this.ship.body.setOffset(7, 11);

    // Engine trail particles
    this.engineEmitter = this.add.particles(0, 0, 'shield_particle', {
      follow: this.ship,
      followOffset: { x: -35, y: 0 },
      speed: { min: 20, max: 60 },
      angle: { min: 170, max: 190 },
      scale: { start: 0.8, end: 0 },
      lifespan: 400,
      frequency: 30,
      alpha: { start: 0.7, end: 0 },
      blendMode: 'ADD',
      quantity: 2
    });
    this.engineEmitter.setDepth(9);

    // ── GROUPS ──
    this.bullets = this.physics.add.group({ maxSize: 20 });
    this.worms = this.physics.add.group();
    this.rocks = this.physics.add.group();
    this.spiceGroup = this.physics.add.group();

    // ── COLLISIONS ──
    this.physics.add.overlap(this.bullets, this.worms, this.hitWorm, null, this);
    this.physics.add.overlap(this.bullets, this.rocks, this.hitRock, null, this);
    this.physics.add.overlap(this.ship, this.spiceGroup, this.collectSpice, null, this);
    this.physics.add.overlap(this.ship, this.worms, this.shipHit, null, this);
    this.physics.add.overlap(this.ship, this.rocks, this.shipHit, null, this);

    // ── TIMERS ──
    this.wormTimer = this.time.addEvent({
      delay: 2200,
      callback: this.spawnWorm,
      callbackScope: this,
      loop: true
    });

    this.rockTimer = this.time.addEvent({
      delay: 3000,
      callback: this.spawnRock,
      callbackScope: this,
      loop: true
    });

    this.spiceTimer = this.time.addEvent({
      delay: 800,
      callback: this.spawnSpice,
      callbackScope: this,
      loop: true
    });

    // ── HUD ──
    this.hudBg = this.add.graphics();
    this.hudBg.fillStyle(0x000000, 0.5);
    this.hudBg.fillRect(0, 0, W, 36);
    this.hudBg.setDepth(20);
    this.hudBg.setScrollFactor(0);

    this.levelText = this.add.text(15, 8, 'I — CRUISE', {
      fontFamily: 'Courier New', fontSize: '14px', fontStyle: 'bold', color: '#4a9eff'
    }).setDepth(21);

    this.scoreText = this.add.text(W / 2, 8, 'SCORE: 0', {
      fontFamily: 'Courier New', fontSize: '14px', color: '#c0c0c0'
    }).setOrigin(0.5, 0).setDepth(21);

    this.spiceText = this.add.text(W - 15, 8, 'SPICE: 0', {
      fontFamily: 'Courier New', fontSize: '14px', color: '#ff8c00'
    }).setOrigin(1, 0).setDepth(21);

    // Shield display
    this.shieldText = this.add.text(W / 2, 22, '♦ ♦ ♦', {
      fontFamily: 'Courier New', fontSize: '11px', color: '#4a9eff'
    }).setOrigin(0.5, 0).setDepth(21);

    // ── INPUT ──
    this.cursors = this.input.keyboard.createCursorKeys();
    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.lastFired = 0;

    // ── RAIN STATE (level 3) ──
    this.rainDrops = [];

    this.cameras.main.fadeIn(500, 0, 0, 0);
  }

  drawDesert(offset) {
    this.desertG.clear();
    // Main desert body
    this.desertG.fillGradientStyle(0x8b6914, 0x8b6914, 0x6b5010, 0x6b5010, 1);
    this.desertG.fillRect(0, H * 0.62, W, H * 0.38);
    // Dune waves
    this.desertG.lineStyle(1, 0x9b7924, 0.25);
    for (let i = 0; i < 10; i++) {
      const y = H * 0.64 + i * 18;
      this.desertG.beginPath();
      this.desertG.moveTo(0, y);
      for (let x = 0; x <= W; x += 10) {
        this.desertG.lineTo(x, y + Math.sin((x + offset) * 0.008 + i * 1.2) * 8);
      }
      this.desertG.strokePath();
    }
    // Horizon heat shimmer line
    this.desertG.lineStyle(1, 0xffaa00, 0.08);
    this.desertG.beginPath();
    this.desertG.moveTo(0, H * 0.62);
    for (let x = 0; x <= W; x += 5) {
      this.desertG.lineTo(x, H * 0.62 + Math.sin((x + offset * 2) * 0.02) * 2);
    }
    this.desertG.strokePath();
  }

  update(time, delta) {
    if (this.gameOver) return;

    // ── SHIP MOVEMENT ──
    const shipSpeed = 280;
    if (this.cursors.up.isDown) this.ship.setVelocityY(-shipSpeed);
    else if (this.cursors.down.isDown) this.ship.setVelocityY(shipSpeed);
    else this.ship.setVelocityY(this.ship.body.velocity.y * 0.85);

    if (this.cursors.left.isDown) this.ship.setVelocityX(-shipSpeed * 0.7);
    else if (this.cursors.right.isDown) this.ship.setVelocityX(shipSpeed * 0.5);
    else this.ship.setVelocityX(this.ship.body.velocity.x * 0.85);

    // Slight tilt
    this.ship.setRotation(this.ship.body.velocity.y * 0.0008);

    // ── SHOOTING ──
    if (this.spaceKey.isDown && time > this.lastFired + 200) {
      this.fireBullet();
      this.lastFired = time;
    }

    // ── PARALLAX ──
    this.stars.forEach(s => {
      s.x -= s.speed * this.gameSpeed;
      if (s.x < -10) s.x = W + 10;
    });

    this.desertOffset += this.gameSpeed * 1.5;
    if (this.desertOffset % 3 < 2) this.drawDesert(this.desertOffset);

    // ── SCORING ──
    this.distance += this.gameSpeed * 0.1;
    this.score = Math.floor(this.distance) * 10 + this.spiceCollected * 50;
    this.scoreText.setText('SCORE: ' + this.score);

    // ── LEVEL PROGRESSION ──
    let newLevel = 1;
    for (let i = this.levelThresholds.length - 1; i >= 0; i--) {
      if (this.score >= this.levelThresholds[i]) {
        newLevel = i + 1;
        break;
      }
    }
    if (newLevel !== this.level) {
      this.level = newLevel;
      this.onLevelUp();
    }

    // ── SPEED RAMP ──
    this.gameSpeed = 2 + this.level * 0.35;

    // ── RAIN (level 3+) ──
    if (this.level >= 3) {
      this.updateRain();
    }

    // ── CLEANUP OFF-SCREEN ──
    this.worms.getChildren().forEach(w => {
      if (w.active && w.x < -180) w.destroy();
    });
    this.rocks.getChildren().forEach(r => {
      if (r.active && r.x < -50) r.destroy();
    });
    this.spiceGroup.getChildren().forEach(s => {
      if (s.active && s.x < -20) s.destroy();
    });
    this.bullets.getChildren().forEach(b => {
      if (b.active && b.x > W + 20) b.destroy();
    });
  }

  fireBullet() {
    const b = this.bullets.create(this.ship.x + 30, this.ship.y, 'bullet');
    if (!b) return;
    b.setScale(1.5);
    b.setDepth(8);
    b.body.setAllowGravity(false);
    b.setVelocityX(500);
  }

  spawnWorm() {
    if (this.gameOver) return;
    const y = Phaser.Math.Between(H * 0.2, H * 0.75);
    const w = this.worms.create(W + 80, y, 'worm');
    w.setScale(Phaser.Math.FloatBetween(1.2, 2.0));
    w.setDepth(5);
    w.body.setAllowGravity(false);
    w.setVelocityX(-120 - this.level * 20);
    // Sinusoidal movement
    w.waveOffset = Phaser.Math.FloatBetween(0, Math.PI * 2);
    w.waveAmp = Phaser.Math.Between(30, 80);
    w.baseY = y;
    this.tweens.add({
      targets: w,
      y: y - w.waveAmp,
      duration: Phaser.Math.Between(1000, 2000),
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    });
  }

  spawnRock() {
    if (this.gameOver) return;
    if (Phaser.Math.Between(0, 100) > 50 + this.level * 5) return;
    const y = Phaser.Math.Between(H * 0.3, H * 0.6);
    const r = this.rocks.create(W + 40, y, 'rock');
    r.setScale(Phaser.Math.FloatBetween(1.5, 3));
    r.setDepth(5);
    r.body.setAllowGravity(false);
    r.setVelocityX(-80 - this.level * 15);
    r.setAngularVelocity(Phaser.Math.Between(-60, 60));
  }

  spawnSpice() {
    if (this.gameOver) return;
    if (Phaser.Math.Between(0, 100) > 40) return;
    const y = Phaser.Math.Between(50, H * 0.55);
    const s = this.spiceGroup.create(W + 20, y, 'spice');
    s.setScale(1.5);
    s.setDepth(6);
    s.body.setAllowGravity(false);
    s.setVelocityX(-100 - this.level * 10);
    // Glow pulse
    this.tweens.add({
      targets: s,
      alpha: 0.4,
      duration: 400,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    });
  }

  collectSpice(ship, spice) {
    spice.destroy();
    this.spiceCollected++;
    this.spiceText.setText('SPICE: ' + this.spiceCollected);

    // Flash effect
    this.cameras.main.flash(100, 255, 140, 0, false, null, this);

    // Heal shield every 10 spice
    if (this.spiceCollected % 10 === 0 && this.shieldHP < 3) {
      this.shieldHP++;
      this.updateShieldDisplay();
    }
  }

  hitWorm(bullet, worm) {
    // Explosion
    const ex = this.add.particles(worm.x, worm.y, 'explosion', {
      speed: { min: 50, max: 200 },
      scale: { start: 1.5, end: 0 },
      lifespan: 500,
      quantity: 15,
      blendMode: 'ADD'
    });
    this.time.delayedCall(600, () => ex.destroy());

    bullet.destroy();
    worm.destroy();
    this.score += 100;
  }

  hitRock(bullet, rock) {
    const ex = this.add.particles(rock.x, rock.y, 'explosion', {
      speed: { min: 30, max: 120 },
      scale: { start: 1, end: 0 },
      lifespan: 400,
      quantity: 8,
      blendMode: 'ADD'
    });
    this.time.delayedCall(500, () => ex.destroy());
    bullet.destroy();
    rock.destroy();
    this.score += 50;
  }

  shipHit(ship, obstacle) {
    if (this.isInvincible || this.gameOver) return;

    this.shieldHP--;
    this.updateShieldDisplay();
    obstacle.destroy();

    // Hit flash
    this.cameras.main.shake(200, 0.01);
    this.cameras.main.flash(200, 255, 0, 0, false, null, this);

    if (this.shieldHP <= 0) {
      this.doGameOver();
    } else {
      // Brief invincibility
      this.isInvincible = true;
      this.tweens.add({
        targets: this.ship,
        alpha: 0.3,
        duration: 100,
        yoyo: true,
        repeat: 8,
        onComplete: () => {
          this.isInvincible = false;
          this.ship.setAlpha(1);
        }
      });
    }
  }

  updateShieldDisplay() {
    const diamonds = [];
    for (let i = 0; i < 3; i++) {
      diamonds.push(i < this.shieldHP ? '♦' : '◇');
    }
    this.shieldText.setText(diamonds.join(' '));
    this.shieldText.setColor(this.shieldHP === 1 ? '#ff4444' : '#4a9eff');
  }

  onLevelUp() {
    this.levelText.setText(this.levelNames[this.level - 1] || 'LEVEL ' + this.level);

    // Big level announcement
    const announce = this.add.text(W / 2, H / 2, this.levelNames[this.level - 1] || 'LEVEL ' + this.level, {
      fontFamily: 'Courier New',
      fontSize: '32px',
      fontStyle: 'bold',
      color: '#4a9eff',
      stroke: '#001a2a',
      strokeThickness: 4,
      shadow: { offsetX: 0, offsetY: 0, color: '#4a9eff', blur: 25, fill: true }
    }).setOrigin(0.5).setDepth(30).setAlpha(0);

    this.tweens.add({
      targets: announce,
      alpha: 1,
      scale: { from: 0.5, to: 1.2 },
      duration: 600,
      yoyo: true,
      hold: 1000,
      ease: 'Back.easeOut',
      onComplete: () => announce.destroy()
    });

    // Speed up spawns
    if (this.wormTimer.delay > 800) {
      this.wormTimer.delay = Math.max(800, 2200 - this.level * 150);
    }
  }

  updateRain() {
    // Spawn rain drops
    if (Phaser.Math.Between(0, 100) < 20 + this.level * 3) {
      const rd = this.add.graphics();
      rd.lineStyle(1, 0x6688aa, 0.4);
      rd.lineBetween(0, 0, -4, 12);
      rd.x = Phaser.Math.Between(0, W);
      rd.y = -10;
      rd.setDepth(15);
      this.rainDrops.push(rd);
    }
    // Move rain
    for (let i = this.rainDrops.length - 1; i >= 0; i--) {
      const rd = this.rainDrops[i];
      rd.y += 8;
      rd.x -= 1;
      if (rd.y > H + 20) {
        rd.destroy();
        this.rainDrops.splice(i, 1);
      }
    }
  }

  doGameOver() {
    this.gameOver = true;
    this.ship.setActive(false);

    // Big explosion on ship
    const ex = this.add.particles(this.ship.x, this.ship.y, 'explosion', {
      speed: { min: 50, max: 300 },
      scale: { start: 2, end: 0 },
      lifespan: 1000,
      quantity: 40,
      blendMode: 'ADD'
    });

    this.ship.setVisible(false);
    this.engineEmitter.stop();

    // Stop spawning
    this.wormTimer.destroy();
    this.rockTimer.destroy();
    this.spiceTimer.destroy();

    this.time.delayedCall(1500, () => {
      ex.destroy();

      // Overlay
      const overlay = this.add.graphics();
      overlay.fillStyle(0x000000, 0.7);
      overlay.fillRect(0, 0, W, H);
      overlay.setDepth(25);

      this.add.text(W / 2, H * 0.3, 'THE SHIP FALLS', {
        fontFamily: 'Courier New', fontSize: '36px', fontStyle: 'bold',
        color: '#c0c0c0',
        shadow: { offsetX: 0, offsetY: 0, color: '#ff4400', blur: 20, fill: true }
      }).setOrigin(0.5).setDepth(26);

      this.add.text(W / 2, H * 0.43, 'SCORE: ' + this.score, {
        fontFamily: 'Courier New', fontSize: '24px', color: '#ff8c00'
      }).setOrigin(0.5).setDepth(26);

      this.add.text(W / 2, H * 0.52, 'SPICE: ' + this.spiceCollected, {
        fontFamily: 'Courier New', fontSize: '18px', color: '#ffaa33'
      }).setOrigin(0.5).setDepth(26);

      this.add.text(W / 2, H * 0.62, 'REACHED: ' + (this.levelNames[this.level - 1] || 'LEVEL ' + this.level), {
        fontFamily: 'Courier New', fontSize: '16px', color: '#4a9eff'
      }).setOrigin(0.5).setDepth(26);

      const retry = this.add.text(W / 2, H * 0.78, '▶  PRESS ENTER TO FLY AGAIN  ◀', {
        fontFamily: 'Courier New', fontSize: '18px', color: '#4a9eff',
        shadow: { offsetX: 0, offsetY: 0, color: '#4a9eff', blur: 12, fill: true }
      }).setOrigin(0.5).setDepth(26);

      this.tweens.add({
        targets: retry,
        alpha: 0.3, duration: 700, yoyo: true, repeat: -1
      });

      this.input.keyboard.on('keydown-ENTER', () => {
        this.cameras.main.fadeOut(400, 0, 0, 0);
        this.time.delayedCall(400, () => this.scene.restart());
      });
    });
  }
}

// ═══════════════════════════════════════════════════════
// LAUNCH
// ═══════════════════════════════════════════════════════
const config = {
  type: Phaser.AUTO,
  width: W,
  height: H,
  parent: 'game-container',
  backgroundColor: '#000000',
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 0 },
      debug: false
    }
  },
  scene: [BootScene, MenuScene, GameScene],
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  }
};

const game = new Phaser.Game(config);
</script>
</body>
