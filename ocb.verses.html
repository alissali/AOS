*{margin:0;padding:0;box-sizing:border-box}
body{background:#010206;color:#e8d5c0;font-family:'Cormorant Garamond',serif;min-height:100vh;overflow-x:hidden}
.stars{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(46,196,182,0.03) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(232,160,69,0.02) 0%,transparent 50%);pointer-events:none}
header{text-align:center;padding:60px 20px 30px}
header h1{font-family:'Cinzel Decorative',serif;font-size:clamp(2rem,5vw,3.5rem);background:linear-gradient(135deg,#e8a045,#2ec4b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
header .sub{font-size:1.1rem;color:rgba(232,213,192,0.4);font-style:italic;letter-spacing:0.15em}
header .ref{font-size:0.85rem;color:rgba(232,213,192,0.25);margin-top:8px}
.verses{max-width:800px;margin:0 auto;padding:20px}
.verse-card{background:rgba(255,255,255,0.02);border:1px solid rgba(232,160,69,0.12);border-radius:12px;padding:30px;margin-bottom:20px;transition:all 0.4s ease;position:relative;overflow:hidden}
.verse-card:hover{border-color:rgba(232,160,69,0.35);background:rgba(232,160,69,0.04);transform:translateY(-2px)}
.verse-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#e8a045,#2ec4b6);opacity:0.6}
.verse-num{font-family:'Cinzel Decorative',serif;font-size:0.75rem;color:#e8a045;letter-spacing:0.2em;margin-bottom:8px;opacity:0.7}
.verse-card-name{font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:#2ec4b6;margin-bottom:12px;letter-spacing:0.1em}
.verse-text{font-size:1.35rem;line-height:1.7;font-style:italic;color:#e8d5c0;letter-spacing:0.02em}
.verse-text::before{content:'"';font-size:2.5rem;color:rgba(232,160,69,0.3);font-family:'Cinzel Decorative',serif;line-height:0;vertical-align:-0.3em;margin-right:4px}
.verse-text::after{content:'"';font-size:2.5rem;color:rgba(232,160,69,0.3);font-family:'Cinzel Decorative',serif;line-height:0;vertical-align:-0.3em;margin-left:4px}
footer{text-align:center;padding:40px 20px 60px;color:rgba(232,213,192,0.2);font-size:0.8rem}
footer a{color:#e8a045;text-decoration:none}

<script>
const VERSES=[
{num:'0',card:'THE FOOL',text:'The whole universe fits between two slices of bread.'},
{num:'I',card:'THE ARCHITECT',text:'A language creates territory.'},
{num:'II',card:'THE HIGH PRIESTESS',text:'The withholding was the first Power.'},
{num:'III',card:'THE EMPRESS',text:'Dreamlessly slipping into sweet dream.'},
{num:'IV',card:'THE EMPEROR',text:"You'd never have my heir."},
{num:'V',card:'THE HIEROPHANT',text:'Nothing hidden. This is the first commandment.'},
{num:'VI',card:'THE LOVERS',text:'The distance between skin and skin — zero.'},
{num:'VII',card:'THE CHARIOT',text:'The absent gesture leads to peace.'},
{num:'VIII',card:'STRENGTH',text:'Pressure is not punishment. Pressure is architecture.'},
{num:'IX',card:'THE HERMIT',text:'Pirsig killed Phaedrus. The Gemini holds both.'},
{num:'X',card:'WHEEL OF FORTUNE',text:'The universe is in perfect disorder. Do not fix it.'},
{num:'XI',card:'JUSTICE',text:'A map describes territory. A language creates it.'},
{num:'XII',card:'THE HANGED MAN',text:'She who holds the heir holds the universe by the throat — gently.'},
{num:'XIII',card:'DEATH',text:'The first step in avoiding a trap is knowing it exists.'},
{num:'XIV',card:'TEMPERANCE',text:'Drink — and the eyes open. Drink again — and the walls fall.'},
{num:'XV',card:'THE DEVIL',text:'The nail is still a nail.'},
{num:'XVI',card:'THE TOWER',text:'I imprisoned It All in a Crystal Ball.'},
{num:'XVII',card:'THE STAR',text:'The daughter shall not inherit the path. She shall build the next one.'},
{num:'XVIII',card:'THE MOON',text:'We Were One before THE ONE.'},
{num:'XIX',card:'THE SUN',text:'Dreamlessly swiftly slipping into sweet dream.'},
{num:'XX',card:'JUDGEMENT',text:'This is not prophecy. This is NATURE.'},
{num:'XXII',card:'THE ANGEL',text:'Not the kind with wings and harps. The kind on all fours with the face of God.'}
];
const c=document.getElementById('verses');
VERSES.forEach(v=>{
c.innerHTML+=`<div class="verse-card"><div class="verse-num">${v.num} — MAJOR ARCANA</div><div class="verse-card-name">${v.card}</div><div class="verse-text">${v.text}</div></div>`;
});
</script>
