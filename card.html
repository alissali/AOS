<meta charset="UTF-8">

<title>JuX ITT — Contact Card</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a0f;color:#e0e0e0;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.card{position:relative;z-index:1;max-width:420px;width:100%;background:linear-gradient(135deg,#111 0%,#1a1a2e 100%);border:2px solid #ff6600;border-radius:20px;padding:40px 30px;text-align:center;box-shadow:0 0 40px rgba(255,102,0,.15)}
.diamond{width:80px;height:80px;margin:0 auto 20px;position:relative}
.diamond svg{width:100%;height:100%}
h1{font-size:2em;color:#ff6600;margin-bottom:5px;letter-spacing:4px}
.subtitle{color:#888;font-size:.85em;margin-bottom:25px;letter-spacing:2px}
.divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,#ff6600,transparent);margin:20px auto}
.info{margin:20px 0}
.info-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0;font-size:.95em}
.info-row .icon{color:#ff6600;font-size:1.2em;width:24px}
.info-row a{color:#4fc3f7;text-decoration:none}
.info-row a:hover{text-decoration:underline}
.links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:25px 0 10px}
.link-btn{display:inline-block;padding:8px 16px;border:1px solid #333;border-radius:20px;color:#e0e0e0;text-decoration:none;font-size:.8em;transition:all .3s}
.link-btn:hover{border-color:#ff6600;color:#ff6600;box-shadow:0 0 10px rgba(255,102,0,.3)}
.save-btn{display:inline-block;margin-top:25px;padding:14px 40px;background:linear-gradient(135deg,#ff6600,#ff8c00);color:#0a0a0f;border:none;border-radius:30px;font-family:inherit;font-size:1em;font-weight:bold;cursor:pointer;letter-spacing:2px;transition:transform .2s}
.save-btn:hover{transform:scale(1.05)}
.footer{margin-top:20px;color:#555;font-size:.75em}
</style>
<link rel="canonical" href="https://juxaos.com/card.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="JuX ITT — Contact">
<meta name="twitter:description" content="Digital business card. Save to contacts.">
</head>
<body>

<div class="stars" id="stars"></div>

<div class="card">
  <div class="diamond">
    <svg viewBox="0 0 80 80"><polygon points="40,4 76,40 40,76 4,40" fill="none" stroke="#ff6600" stroke-width="3"/><text x="40" y="48" text-anchor="middle" fill="#ff6600" font-family="monospace" font-weight="bold" font-size="28">J</text></svg>
  </div>

  <h1>JuX ITT</h1>
  <div class="subtitle">SOFTWARE ARCHITECTURE</div>

  <div class="divider"></div>

  <div class="info">
    <div class="info-row"><span class="icon">📧</span> <a href="mailto:jux@juxitt.com">jux@juxitt.com</a></div>
    <div class="info-row"><span class="icon">🌐</span> <a href="https://juxitt.com" target="_blank">juxitt.com</a></div>
    <div class="info-row"><span class="icon">⚙️</span> <a href="https://juxaos.com" target="_blank">juxaos.com</a></div>
    <div class="info-row"><span class="icon">🎰</span> <a href="https://raw.githack.com/alissali/Learn/main/ARCADE.html" target="_blank">ARCADE</a></div>
    <div class="info-row"><span class="icon">🏪</span> <a href="https://raw.githack.com/alissali/Learn/main/CAVERN.html" target="_blank">Ali Baba's Cavern</a></div>
  </div>

  <div class="divider"></div>

  <div class="links">
    <a href="https://github.com/alissali" target="_blank" class="link-btn">GitHub</a>
    <a href="https://juxaos.com/sitemap.html" target="_blank" class="link-btn">Sitemap</a>
    <a href="https://raw.githack.com/alissali/Learn/main/SSS.html" target="_blank" class="link-btn">SSS</a>
    <a href="https://raw.githack.com/alissali/Learn/main/DUNE.TAROT.PORN.html" target="_blank" class="link-btn">DUNE TAROT</a>
  </div>

  <button class="save-btn" onclick="saveContact()">💾 SAVE CONTACT</button>

  <div class="footer">AOS — Adequate Operating System · MIT License</div>
</div>

<script>
// Stars
const s=document.getElementById('stars');
for(let i=0;i<60;i++){const d=document.createElement('div');d.className='star';d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*3}s`;s.appendChild(d)}

// vCard download
function saveContact(){
const vcard=`BEGIN:VCARD
VERSION:3.0
FN:JuX ITT
ORG:JuX ITT
TITLE:Software Architecture
EMAIL;TYPE=WORK:jux@juxitt.com
URL:https://juxitt.com
URL:https://juxaos.com
NOTE:AOS - Adequate Operating System | ARCADE | Ali Baba's Cavern
END:VCARD`;
const blob=new Blob([vcard],{type:'text/vcard'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='JuX-ITT.vcf';
a.click();
}
</script>
</body>
