services:
  - type: web
    name: spicebus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn spicebus:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
    disk:
      name: spicebus-data
      mountPath: /data
      sizeGB: 1
