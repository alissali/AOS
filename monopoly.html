let si=0;
function S(){if(si<STREETS.length){BOARD.push({type:'property',...STREETS[si]});si++}else{BOARD.push({type:'empty',name:'★'})}}

// === GRID POSITION MAP ===
// Maps board index → {row, col} on 9×9 grid
const POS=[];

for(let i=0;i<=8;i++) POS.push({r:9,c:9-i});

for(let i=0;i<7;i++) POS.push({r:8-i,c:1});

for(let i=0;i<=8;i++) POS.push({r:1,c:1+i});
// Wait, 16 is already at POS index 16 which maps to (2,1)? Let me recalculate.

// But wait, POS already has 16 entries (indices 0-15). sq 16 = index 16:
// The 16th position (index 16) should be row 1, col 1. Let me verify:

// Left: 7 entries (index 9-15)
// So index 16 starts top row.

for(let i=0;i<=8;i++) POS[i]={r:9,c:9-i};

for(let i=9;i<=15;i++) POS[i]={r:9-(i-8),c:1};

for(let i=16;i<=24;i++) POS[i]={r:1,c:i-15};

  {text:'Advance to Go! Collect $200',action:'goto',val:0,amount:200},
  {text:'Advance to rue des Cinquante Otages',action:'goto',val:5},
  {text:'Advance to Vinbæltet København',action:'goto',val:17},
  {text:'Bank pays you dividend of $50',action:'gain',val:50},
  {text:'Get Out of Jail Free!',action:'jail_free',val:0},
  {text:'Go Back 3 Spaces',action:'back',val:3},
  {text:'Go to Jail!',action:'jail',val:0},
  {text:'Speeding fine $15',action:'lose',val:15},
  {text:'Your building loan matures. Collect $150',action:'gain',val:150},
  {text:'Elected Chairman. Pay each player $50',action:'chairman',val:50}
];

// Game state
let players=[],currentPlayer=0,numPlayers=2,gameActive=false,canBuy=false,currentSquare=null,pendingRent=0,pendingOwner=null,fightsWon=parseInt(localStorage.getItem('mono_fights_won')||'0'),fightsLost=0;

// Prizes
const PRIZES=[
  {id:'first_roll',name:'First Roll',icon:'🎲',desc:'Roll the dice'},
  {id:'first_buy',name:'Landlord',icon:'🏠',desc:'Buy first property'},
  {id:'five_props',name:'Mogul',icon:'🏢',desc:'Own 5 properties'},
  {id:'millionaire',name:'Millionaire',icon:'💎',desc:'Have $2000+'},
  {id:'jailbird',name:'Jailbird',icon:'🔒',desc:'Go to jail'},
  {id:'taxman',name:'Taxman',icon:'💰',desc:'Pay taxes'},
  {id:'globetrotter',name:'Globetrotter',icon:'🌍',desc:'Go around the board'},
  {id:'lucky',name:'Lucky Card',icon:'🃏',desc:'Draw 5 cards'},
  {id:'damascus',name:'Mazzeh Villat',icon:'🕌',desc:'Own Damascus'},
  {id:'first_blood',name:'First Blood',icon:'⚔️',desc:'Win your first fight'},
  {id:'liberator',name:'Liberator',icon:'✊',desc:'Win 3 fights'},
  {id:'fortress',name:'Fortress',icon:'🛡️',desc:'Fortify a property'}
];
let wonPrizes=new Set(JSON.parse(localStorage.getItem('mono_prizes')||'[]'));
let cardsDrawn=parseInt(localStorage.getItem('mono_cards')||'0');
function savePrizes(){localStorage.setItem('mono_prizes',JSON.stringify([...wonPrizes]))}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function checkPrize(id){if(!wonPrizes.has(id)){wonPrizes.add(id);savePrizes();showToast('🏆 '+PRIZES.find(p=>p.id===id).name+'!');playSound(800,0.15);renderPrizes()}}
function renderPrizes(){document.getElementById('prizesGrid').innerHTML=PRIZES.map(p=>`<div class="prize ${wonPrizes.has(p.id)?'won':''}" title="${p.desc}"><span class="icon">${p.icon}</span>${p.name}</div>`).join('')}
function playSound(f,d,t='square'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}

function selectPlayers(n){
  numPlayers=n;
  document.querySelectorAll('.p-token').forEach(t=>{t.classList.toggle('selected',parseInt(t.dataset.n)===n)});
  let h='';
  const FIGHTER_NAMES=['Fighter 1','Fighter 2','Fighter 3','Fighter 4'];
  for(let i=0;i<n;i++)h+=`<div class="setup-opt"><label>${TOKENS[i]} Freedom Fighter ${i+1}</label><input id="pname${i}" value="${FIGHTER_NAMES[i]}" maxlength="12"></div>`;
  document.getElementById('nameInputs').innerHTML=h;
}
selectPlayers(2);

function initGame(){
  players=[];
  for(let i=0;i<numPlayers;i++){
    const el=document.getElementById('pname'+i);
    players.push({name:el?el.value:'Fighter '+(i+1),token:TOKENS[i],color:PCOLORS[i],pos:0,cash:1500,properties:[],inJail:false,jailTurns:0,jailFree:false,laps:0,bankrupt:false});
  }
  currentPlayer=0;gameActive=true;canBuy=false;
  document.getElementById('setupScreen').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  renderBoard();renderPlayers();renderPrizes();
  log(players[0].token+' '+players[0].name+' goes first!');
  if(audioCtx.state==='suspended')audioCtx.resume();
}

function renderBoard(){
  const el=document.getElementById('board');
  let cells=[];
  // Create all 81 cells (9×9)
  for(let r=1;r<=9;r++){
    for(let c=1;c<=9;c++){
      // Find if a board square occupies this cell
      let sqIdx=-1;
      for(let i=0;i<SQ_COUNT;i++){
        if(POS[i].r===r&&POS[i].c===c){sqIdx=i;break}
      }
      if(sqIdx>=0){
        const sq=BOARD[sqIdx];
        const isCorner=[0,8,16,24].includes(sqIdx);
        const isSpecial=sq.type!=='property';
        const ph=players.filter(p=>p.pos===sqIdx&&!p.bankrupt).map(p=>p.token).join('');
        const ownerDot=sq.owner!==undefined?`<div class="owner-dot" style="background:${PCOLORS[sq.owner]}"></div>`:'';
        const colorBar=sq.color?`<div class="color-bar" style="background:${sq.color}"></div>`:'';
        const act=players[currentPlayer]&&players[currentPlayer].pos===sqIdx?' active':'';
        const cls=isCorner?' corner':isSpecial?' special':'';
        const nm=sq.name.replace(/\n/g,'<br>');
        if(isSpecial){
          cells.push(`<div class="sq${cls}${act}" style="grid-row:${r};grid-column:${c}" data-i="${sqIdx}"><div class="splayers">${ph}</div><div style="font-size:1.6em">${sq.icon||''}</div><div class="sname">${nm}</div></div>`);
        }else{
          cells.push(`<div class="sq${act}" style="grid-row:${r};grid-column:${c}" data-i="${sqIdx}">${colorBar}<div class="splayers">${ph}</div><div class="sname">${nm}</div><div class="sprice">$${sq.price}</div>${ownerDot}</div>`);
        }
      }else if(r>=2&&r<=8&&c>=2&&c<=8){
        // Center area — skip, handled by center div
      }
    }
  }
  // Add center
  cells.push(`<div class="board-center"><h2>MONOPOLY</h2><div class="subtitle" style="font-size:0.6em;letter-spacing:3px">THE WORLD IS YOURS</div><div class="dice-area"><div class="die" id="die1">⚀</div><div class="die" id="die2">⚀</div></div><div style="font-size:0.7em;color:rgba(232,213,192,0.3)">🌍 24 Cities · 5 Continents</div></div>`);
  el.innerHTML=cells.join('');
}

function renderPlayers(){
  document.getElementById('playersPanel').innerHTML=players.map((p,i)=>{
    const act=i===currentPlayer&&!p.bankrupt?' active-player':'';
    const st=p.bankrupt?' 💀':p.inJail?' 🔒':'';
    // Build inventory
    const owned=BOARD.filter(sq=>sq.owner===i&&sq.type==='property');
    const totalVal=owned.reduce((s,sq)=>s+sq.price,0);
    const totalRent=owned.reduce((s,sq)=>s+sq.rent,0);
    const netWorth=p.cash+totalVal;
    const invItems=owned.map(sq=>`<div class="inv-item"><div class="inv-dot" style="background:${sq.color}"></div><div class="inv-name">${sq.name.replace(/\n/g,' ')}</div><div class="inv-val">$${sq.rent}/r</div></div>`).join('');
    const invSummary=owned.length>0?`<div class="inv-summary">📊 Value: $${totalVal} · Rent: $${totalRent}/turn · Net: $${netWorth}</div>`:'';
    const toggle=owned.length>0?`<div class="inv-toggle" onclick="this.closest('.p-card').classList.toggle('open')">📋 ${owned.length} properties ▾</div>`:`<div class="p-props">No properties</div>`;
    return `<div class="p-card${act}"><div class="p-name" style="color:${p.color}">${p.token} ${p.name}${st}</div><div class="p-cash">$${p.cash}</div>${toggle}<div class="p-inv">${invItems}${invSummary}</div></div>`;
  }).join('');
}

function log(m){const el=document.getElementById('log');el.innerHTML=`<div class="entry">${m}</div>`+el.innerHTML;if(el.children.length>50)el.removeChild(el.lastChild)}

function rollDice(){
  if(!gameActive)return;
  const p=players[currentPlayer];
  if(p.bankrupt){nextPlayer();return}
  const d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1,total=d1+d2;
  document.getElementById('die1').textContent=DICE_FACE[d1-1];
  document.getElementById('die2').textContent=DICE_FACE[d2-1];
  document.getElementById('die1').classList.add('rolling');
  document.getElementById('die2').classList.add('rolling');
  setTimeout(()=>{document.getElementById('die1').classList.remove('rolling');document.getElementById('die2').classList.remove('rolling')},400);
  playSound(300,0.1);
  checkPrize('first_roll');

  if(p.inJail){
    if(d1===d2){p.inJail=false;p.jailTurns=0;log(p.token+' DOUBLES! Out of jail!')}
    else if(p.jailFree){p.inJail=false;p.jailTurns=0;p.jailFree=false;log(p.token+' uses Jail Free card!')}
    else{p.jailTurns++;if(p.jailTurns>=3){p.inJail=false;p.jailTurns=0;p.cash-=50;log(p.token+' pays $50 bail')}else{log(p.token+' stuck in jail ('+p.jailTurns+'/3)');document.getElementById('rollBtn').style.display='none';document.getElementById('endBtn').style.display='inline-block';renderPlayers();return}}
  }

  const oldPos=p.pos;
  p.pos=(p.pos+total)%SQ_COUNT;
  if(p.pos<oldPos){p.cash+=200;p.laps++;log(p.token+' passed GO! +$200');if(p.laps>=1)checkPrize('globetrotter')}

  const sq=BOARD[p.pos];
  log(p.token+' rolled '+d1+'+'+d2+'='+total+' → '+(sq.name.replace(/\n/g,' ')));
  document.getElementById('rollBtn').style.display='none';
  handleSquare(p,sq);
  renderBoard();renderPlayers();
}

function handleSquare(p,sq){
  canBuy=false;
  document.getElementById('buyBtn').style.display='none';
  if(sq.type==='property'){
    if(sq.owner===undefined){
      if(p.cash>=sq.price){canBuy=true;currentSquare=sq;document.getElementById('buyBtn').style.display='inline-block';log('💡 '+(sq.name.replace(/\n/g,' '))+' — $'+sq.price)}
    }else if(sq.owner!==currentPlayer){
      const ow=players[sq.owner];
      if(!ow.bankrupt){
        currentSquare=sq;pendingRent=sq.rent;pendingOwner=sq.owner;
        log('⚔️ '+(sq.name.replace(/\n/g,' '))+' belongs to '+ow.token+' — FIGHT or PAY $'+sq.rent+'?');
        document.getElementById('fightBtn').style.display='inline-block';
        document.getElementById('payBtn').style.display='inline-block';
        document.getElementById('endBtn').style.display='none';
        return;
      }
    }else{
      log(p.token+' is home at '+(sq.name.replace(/\n/g,' ')));
      const fortCost=Math.floor(sq.price*0.5);
      if(p.cash>=fortCost&&!sq.fortified){
        currentSquare=sq;
        document.getElementById('fortifyBtn').style.display='inline-block';
        log('🛡️ FORTIFY for $'+fortCost+'? (rent ×2)');
      }
    }
  }
  else if(sq.type==='cc'){drawCard(p,CC_CARDS,'Community Chest','📦')}
  else if(sq.type==='chance'){drawCard(p,CHANCE_CARDS,'Chance','❓')}
  else if(sq.type==='tax'){p.cash-=200;log(p.token+' pays $200 tax');checkPrize('taxman');if(p.cash<=0)goBankrupt(p)}
  else if(sq.type==='gotojail'){sendToJail(p)}
  document.getElementById('endBtn').style.display='inline-block';
  renderPlayers();
}

function startFight(){
  const p=players[currentPlayer];
  const ow=players[pendingOwner];
  const sq=currentSquare;
  const sn=sq.name.replace(/\n/g,' ');
  document.getElementById('fightBtn').style.display='none';
  document.getElementById('payBtn').style.display='none';
  // Attacker rolls
  const a1=Math.ceil(Math.random()*6),a2=Math.ceil(Math.random()*6);
  const atk=a1+a2;
  // Defender rolls
  const d1=Math.ceil(Math.random()*6),d2=Math.ceil(Math.random()*6);
  const def=d1+d2;
  playSound(150,0.2,'sawtooth');
  log('⚔️ BATTLE for '+sn+'!');
  log(p.token+' attacks: '+a1+'+'+a2+'='+atk);
  log(ow.token+' defends: '+d1+'+'+d2+'='+def);
  if(atk>def){
    // ATTACKER WINS — LIBERATE
    sq.owner=currentPlayer;
    p.properties.push(sq);
    ow.properties=ow.properties.filter(s=>s!==sq);
    fightsWon++;localStorage.setItem('mono_fights_won',fightsWon);
    log('✊ '+p.token+' LIBERATES '+sn+'! Property seized!');
    playSound(500,0.15);
    showCard('⚔️ LIBERATION!',p.token+' defeats '+ow.token+' and takes '+sn+'!');
    if(fightsWon>=3)checkPrize('liberator');
    if(fightsWon>=1)checkPrize('first_blood');
  }else if(atk<def){
    // DEFENDER WINS — DOUBLE RENT
    const dbl=pendingRent*2;
    p.cash-=dbl;ow.cash+=dbl;
    fightsLost++;
    log('💀 '+p.token+' defeated! Pays DOUBLE rent $'+dbl+' to '+ow.token);
    playSound(100,0.2,'sawtooth');
    showCard('💀 DEFEATED!',p.token+' lost the battle.\nPays $'+dbl+' to '+ow.token);
    if(p.cash<=0)goBankrupt(p);
  }else{
    // TIE — normal rent
    p.cash-=pendingRent;ow.cash+=pendingRent;
    log('🤝 Standoff! '+p.token+' pays normal rent $'+pendingRent);
    showCard('🤝 STANDOFF','Equal strength. Normal rent $'+pendingRent);
  }
  document.getElementById('endBtn').style.display='inline-block';
  renderBoard();renderPlayers();
}

function payRent(){
  const p=players[currentPlayer];
  const ow=players[pendingOwner];
  document.getElementById('fightBtn').style.display='none';
  document.getElementById('payBtn').style.display='none';
  p.cash-=pendingRent;ow.cash+=pendingRent;
  log(p.token+' pays $'+pendingRent+' rent to '+ow.token);
  playSound(200,0.15,'sawtooth');
  if(p.cash<=0)goBankrupt(p);
  document.getElementById('endBtn').style.display='inline-block';
  renderPlayers();
}

function fortifyProperty(){
  const p=players[currentPlayer];
  const sq=currentSquare;
  const cost=Math.floor(sq.price*0.5);
  document.getElementById('fortifyBtn').style.display='none';
  p.cash-=cost;
  sq.rent=sq.rent*2;
  sq.fortified=true;
  log('🛡️ '+p.token+' FORTIFIES '+(sq.name.replace(/\n/g,' '))+' for $'+cost+' — rent now $'+sq.rent);
  playSound(400,0.12);
  showCard('🛡️ FORTIFIED!',(sq.name.replace(/\n/g,' '))+'\nRent doubled to $'+sq.rent);
  checkPrize('fortress');
  renderPlayers();
}

function drawCard(p,deck,title,icon){
  cardsDrawn++;localStorage.setItem('mono_cards',cardsDrawn);
  if(cardsDrawn>=5)checkPrize('lucky');
  const card=deck[Math.floor(Math.random()*deck.length)];
  showCard(icon+' '+title,card.text);
  if(card.action==='gain'){p.cash+=card.val;log(p.token+' +$'+card.val)}
  else if(card.action==='lose'){p.cash-=card.val;log(p.token+' -$'+card.val);if(p.cash<=0)goBankrupt(p)}
  else if(card.action==='goto'){const old=p.pos;p.pos=card.val;if(card.amount)p.cash+=card.amount;if(p.pos<old){p.cash+=200;p.laps++}log(p.token+' → '+(BOARD[p.pos].name.replace(/\n/g,' ')));renderBoard()}
  else if(card.action==='jail'){sendToJail(p)}
  else if(card.action==='jail_free'){p.jailFree=true;log(p.token+' gets Jail Free!')}
  else if(card.action==='back'){p.pos=(p.pos-card.val+SQ_COUNT)%SQ_COUNT;log(p.token+' back to '+(BOARD[p.pos].name.replace(/\n/g,' ')));handleSquare(p,BOARD[p.pos]);renderBoard()}
  else if(card.action==='birthday'){const a=card.val*(players.filter(x=>!x.bankrupt).length-1);p.cash+=a;players.forEach((x,i)=>{if(i!==currentPlayer&&!x.bankrupt)x.cash-=card.val});log(p.token+' birthday! +$'+a)}
  else if(card.action==='chairman'){const a=card.val*(players.filter(x=>!x.bankrupt).length-1);p.cash-=a;players.forEach((x,i)=>{if(i!==currentPlayer&&!x.bankrupt)x.cash+=card.val});log(p.token+' chairman -$'+a)}
  renderPlayers();
}

function showCard(t,tx){document.getElementById('cardTitle').textContent=t;document.getElementById('cardText').textContent=tx;document.getElementById('cardPopup').style.display='block';document.getElementById('overlay').style.display='block'}
function closeCard(){document.getElementById('cardPopup').style.display='none';document.getElementById('overlay').style.display='none'}

function sendToJail(p){p.inJail=true;p.jailTurns=0;p.pos=8;log(p.token+' → JAIL! 🔒');checkPrize('jailbird');playSound(150,0.3,'sawtooth');renderBoard()}

function buyProperty(){
  if(!canBuy||!currentSquare)return;
  const p=players[currentPlayer];
  p.cash-=currentSquare.price;
  currentSquare.owner=currentPlayer;
  p.properties.push(currentSquare.name.replace(/\n/g,' '));
  log(p.token+' buys '+(currentSquare.name.replace(/\n/g,' '))+' $'+currentSquare.price);
  playSound(600,0.15,'sine');
  checkPrize('first_buy');
  if(p.properties.length>=5)checkPrize('five_props');
  if(p.cash>=2000)checkPrize('millionaire');
  if(currentSquare.name.includes('Mazzeh'))checkPrize('damascus');
  canBuy=false;
  document.getElementById('buyBtn').style.display='none';
  renderBoard();renderPlayers();
}

function goBankrupt(p){
  p.bankrupt=true;p.cash=0;
  log('💀 '+p.token+' '+p.name+' BANKRUPT!');
  playSound(100,0.5,'sawtooth');
  BOARD.forEach(sq=>{if(sq.owner===players.indexOf(p))sq.owner=undefined});
  p.properties=[];
  const alive=players.filter(x=>!x.bankrupt);
  if(alive.length===1){
    log('🏆 '+alive[0].token+' '+alive[0].name+' WINS! THE WORLD IS THEIRS!');
    gameActive=false;showToast('🏆 '+alive[0].name+' WINS!');
  }
  renderBoard();renderPlayers();
}

function endTurn(){
  if(!gameActive)return;
  do{currentPlayer=(currentPlayer+1)%numPlayers}while(players[currentPlayer].bankrupt&&players.filter(x=>!x.bankrupt).length>1);
  canBuy=false;
  document.getElementById('rollBtn').style.display='inline-block';
  document.getElementById('buyBtn').style.display='none';
  document.getElementById('endBtn').style.display='none';
  const p=players[currentPlayer];
  if(p.cash>=2000)checkPrize('millionaire');
  log('— '+p.token+' '+p.name+"'s turn —");
  renderBoard();renderPlayers();
}
