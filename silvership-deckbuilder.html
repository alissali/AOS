.ring-ready{animation:pulse-glow 1.5s infinite}
.damage-flash{animation:shake .3s ease-out}

class Game {
  constructor(){
    this.reset();
  }
  reset(){
    this.deck=this.shuffle([...CONFIG.startDeck]);
    this.discard=[];
    this.hand=[];
    this.wave=0;
    this.enemies=[];
    this.attack=0;
    this.shield=0;
    this.credits=0;
    this.charge=0;
    this.hullBreach=0;
    this.selectedRing=null;
    this.charges={plasma:0,cargo:0,ftl:0,shields:0,impossible:0};
    this.impossibleUnlocked=false;
    this.played=new Set();
    this.log='⚡ Systems online. Choose your ring module, Captain.';
    this.phase='ring-select';
    this.gameOver=false;
    this.victory=false;
    this.targetIdx=0;
  }
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  draw(n){
    for(let i=0;i<n;i++){
      if(this.deck.length===0){
        if(this.discard.length===0)break;
        this.deck=this.shuffle([...this.discard]);
        this.discard=[];
      }
      this.hand.push(this.deck.pop());
    }
  }
  selectRing(id){
    this.selectedRing=id;
    this.phase='battle';
    this.wave=0;
    this.spawnWave();
    this.draw(5);
    this.log=`🛸 ${CONFIG.rings.find(r=>r.id===id).name} MODULE ONLINE — Sector 1 incoming!`;
  }
  spawnWave(){
    const w=CONFIG.waves[this.wave];
    this.enemies=w.enemies.map(e=>({...e,maxHp:e.hp}));
    this.targetIdx=0;
  }
  playCard(idx){
    if(this.played.has(idx)||this.phase!=='battle')return;
    const c=this.hand[idx];
    this.attack+=(c.atk||0);
    this.shield+=(c.def||0);
    this.credits+=(c.crd||0);
    this.charge+=(c.chg||0);
    if(c.hull)this.hullBreach=Math.max(0,this.hullBreach+(c.hull||0));
    this.played.add(idx);
    // Distribute charge to selected ring
    if(c.chg&&this.selectedRing){
      this.charges[this.selectedRing]=Math.min(
        this.charges[this.selectedRing]+(c.chg||0),
        CONFIG.rings.find(r=>r.id===this.selectedRing).maxCharge
      );
      // Also charge Impossibility Core when unlocked
      if(this.impossibleUnlocked){
        const ic=CONFIG.rings.find(r=>r.id==='impossible');
        this.charges['impossible']=Math.min(this.charges['impossible']+(c.chg||0),ic.maxCharge);
      }
    }
    this.log=`Played ${c.emoji} ${c.name}`;
    if(this.hullBreach>=10){this.gameOver=true;this.victory=false;this.log='💀 HULL BREACH CRITICAL — Ship destroyed!';}
  }
  activateRing(){
    const r=CONFIG.rings.find(x=>x.id===this.selectedRing);
    if(this.charges[this.selectedRing]<r.maxCharge)return;
    this.charges[this.selectedRing]=0;
    switch(this.selectedRing){
      case'plasma':this.attack+=8;this.attack+=2;this.log='🔫 PLASMA CANNON FIRED — +8 damage, +2 attack!';break;
      case'cargo':this.credits+=6;this.draw(2);this.log='📦 CARGO HOLD OPENED — +6 credits, drew 2!';break;
      case'ftl':this.enemies.forEach(e=>{if(e.hp>0)e.hp=Math.max(0,e.hp-5)});this.log='⚡ FTL SHOCKWAVE — 5 damage to ALL!';break;
      case'shields':this.enemies.forEach(e=>{if(e.hp>0)e.hp=Math.max(0,e.hp-3)});this.shield+=4;this.log='🛡️ SHIELD OVERLOAD — enemies -3 HP, +4 shields!';break;
      case'impossible':
        this.enemies.forEach(e=>{if(e.hp>0)e.hp=Math.max(0,e.hp-7)});
        this.shield+=5;this.draw(3);this.hullBreach=Math.max(0,this.hullBreach-3);
        this.log='♾️ IMPOSSIBILITY CORE FIRES — REALITY WARPS! 7 dmg ALL + 5 shields + draw 3 + heal 3 hull!';
        break;
    }
    this.checkWaveCleared();
  }
  attackEnemy(){
    if(this.attack<=0||!this.enemies.length)return;
    const e=this.enemies[this.targetIdx];
    if(!e||e.hp<=0)return;
    e.hp=Math.max(0,e.hp-this.attack);
    this.log=`💥 Hit ${e.emoji} ${e.name} for ${this.attack} damage!`;
    this.attack=0;
    this.checkWaveCleared();
  }
  checkWaveCleared(){
    if(this.enemies.every(e=>e.hp<=0)){
      if(this.wave>=CONFIG.waves.length-1){
        this.gameOver=true;this.victory=true;
        this.log='🏴‍☠️ THE LEVIATHAN IS SLAIN — THE SILVER SHIP SAILS FREE!';
      } else {
        this.wave++;
        if(this.wave===3 && !this.impossibleUnlocked){
          this.impossibleUnlocked=true;
          this.log=`⚠️ SECTOR 4 INCOMING — ♾️ IMPOSSIBILITY CORE UNLOCKED! A second ring module comes online!`;
        } else {
          this.log=`✅ Sector cleared! Entering ${CONFIG.waves[this.wave].name}`;
        }
        this.spawnWave();
      }
    }
    // Auto-advance target
    while(this.targetIdx<this.enemies.length&&this.enemies[this.targetIdx].hp<=0)this.targetIdx++;
    if(this.targetIdx>=this.enemies.length)this.targetIdx=this.enemies.findIndex(e=>e.hp>0);
    if(this.targetIdx<0)this.targetIdx=0;
  }
  endTurn(){
    // Enemy attacks
    let totalDmg=0;
    this.enemies.forEach(e=>{if(e.hp>0)totalDmg+=e.atk});
    let absorbed=Math.min(this.shield,totalDmg);
    let remaining=totalDmg-absorbed;
    this.hullBreach+=remaining;
    this.log=`🚨 Enemies deal ${totalDmg} damage! ${absorbed} absorbed. Hull breach: ${this.hullBreach}/10`;
    // Discard hand
    this.hand.forEach(c=>this.discard.push(c));
    this.hand=[];
    this.played.clear();
    this.attack=0;this.shield=0;this.credits=0;this.charge=0;
    this.draw(5);
    if(this.hullBreach>=10){this.gameOver=true;this.victory=false;this.log='💀 HULL BREACH CRITICAL — Ship torn apart in the void!';}
  }
  buyCard(idx){
    const c=CONFIG.market[idx];
    if(this.credits<c.cost)return;
    this.credits-=c.cost;
    this.discard.push({name:c.name,emoji:c.emoji,atk:c.atk,def:c.def,crd:c.crd,chg:c.chg,hull:c.hull,desc:c.desc});
    this.log=`🛒 Acquired ${c.emoji} ${c.name}!`;
  }
  purgeHull(){
    if(this.credits<2||this.hullBreach<=0)return;
    this.credits-=2;
    this.hullBreach=Math.max(0,this.hullBreach-3);
    this.log='🔧 Emergency repairs! -3 Hull Breach (cost: 2 credits)';
  }
}

const game=new Game();

function render(){
  const app=document.getElementById('app');
  if(game.phase==='ring-select'){
    app.innerHTML=`
      <div class="header">
        <h1>🛸 SILVER SHIP: PIRATE'S FORTUNE 🏴‍☠️</h1>
        <div class="subtitle">Choose Your Ship Module</div>
      </div>
      <div style="padding:20px;text-align:center;color:#5a8aaa;font-size:.8em">
        Each module charges during battle. When fully charged — unleash its power!
      </div>
      <div class="rings-section">
        ${CONFIG.rings.filter(r=>!r.hidden).map(r=>`
          <div class="ring-card" onclick="game.selectRing('${r.id}');render()">
            <div class="emoji">${r.emoji}</div>
            <div class="rname">${r.name}</div>
            <div class="rtype">${r.type}</div>
            <div class="ring-power">${r.desc}</div>
            <div style="font-size:.6em;color:#556;margin-top:3px">Charge: ${r.maxCharge}</div>
          </div>
        `).join('')}
        <div class="ring-card" style="border:2px dashed #442255;opacity:.5;cursor:default">
          <div class="emoji">❓</div>
          <div class="rname" style="color:#884488">???</div>
          <div class="rtype" style="color:#553366">LOCKED</div>
          <div class="ring-power" style="color:#553366">Survive to Sector 4...</div>
        </div>
      </div>
      <div class="log">${game.log}</div>
    `;
    return;
  }
  if(game.gameOver){
    app.innerHTML=`
      <div class="game-over ${game.victory?'victory':'defeat'}">
        <h2>${game.victory?'🏴‍☠️ VICTORY — THE VOID IS YOURS!':'💀 SHIP DESTROYED — LOST TO THE VOID'}</h2>
        <p style="color:#5a8aaa;margin:10px 0">${game.victory?'The Silver Ship sails on through the stars forever...':'The void claims another pirate. The Leviathan feeds.'}</p>
        <p style="color:#445;font-size:.8em">Wave reached: ${game.wave+1}/5 | Hull Breach: ${game.hullBreach}/10</p>
        <button class="btn" onclick="game.reset();render()" style="margin-top:15px">⚡ NEW VOYAGE</button>
      </div>
    `;
    return;
  }
  const ring=CONFIG.rings.find(r=>r.id===game.selectedRing);
  const chg=game.charges[game.selectedRing];
  const ringReady=chg>=ring.maxCharge;
  app.innerHTML=`
    <div class="header">
      <h1>🛸 SILVER SHIP: PIRATE'S FORTUNE</h1>
      <div class="subtitle">SECTOR ${game.wave+1} — ${CONFIG.waves[game.wave].name}</div>
    </div>
    <div class="stats-bar">
      <div class="stat stat-atk"><div class="val">${game.attack}</div><div class="lbl">⚔️ Attack</div></div>
      <div class="stat stat-shd"><div class="val">${game.shield}</div><div class="lbl">🛡️ Shield</div></div>
      <div class="stat stat-crd"><div class="val">${game.credits}</div><div class="lbl">💰 Credits</div></div>
      <div class="stat stat-chg"><div class="val">${chg}/${ring.maxCharge}</div><div class="lbl">${ring.emoji} Charge</div></div>
      <div class="stat ${game.hullBreach>=7?'hull-danger':''}"><div class="val stat-hull">${game.hullBreach}/10</div><div class="lbl">⚠️ Hull Breach</div></div>
    </div>
    <div style="text-align:center;padding:4px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap">
      <div class="ring-card ${ringReady?'ring-ready':''}" style="display:inline-block;cursor:${ringReady?'pointer':'default'};border-color:${ringReady?ring.color:'#334'}" onclick="${ringReady?`game.activateRing();render()`:''}">
        <div class="emoji">${ring.emoji}</div>
        <div class="rname">${ring.name}</div>
        <div class="charge-bar"><div class="charge-fill ${ringReady?'ready':'charging'}" style="width:${(chg/ring.maxCharge)*100}%"></div></div>
        <div class="ring-power">${ringReady?'⚡ READY — CLICK TO FIRE!':ring.desc}</div>
      </div>
      ${game.impossibleUnlocked?(()=>{
        const ic=CONFIG.rings.find(r=>r.id==='impossible');
        const icChg=game.charges['impossible'];
        const icReady=icChg>=ic.maxCharge;
        return `<div class="ring-card ${icReady?'ring-ready':''}" style="display:inline-block;cursor:${icReady?'pointer':'default'};border-color:${icReady?ic.color:'#334'};background:linear-gradient(135deg,#1a0030,#2a0040)" onclick="${icReady?`game.selectedRing='impossible';game.activateRing();game.selectedRing='${game.selectedRing}';render()`:''}">
          <div class="emoji">${ic.emoji}</div>
          <div class="rname" style="color:#ff00ff">${ic.name}</div>
          <div class="charge-bar"><div class="charge-fill ${icReady?'ready':'charging'}" style="width:${(icChg/ic.maxCharge)*100}%;${icReady?'background:linear-gradient(90deg,#ff00ff,#ff66ff);box-shadow:0 0 8px #ff00ff88':''}""></div></div>
          <div class="ring-power" style="color:#ff66ff">${icReady?'♾️ FIRE THE IMPOSSIBLE!':ic.desc}</div>
          <div style="font-size:.6em;color:#884488;margin-top:2px">${icChg}/${ic.maxCharge}</div>
        </div>`;
      })():''}
    </div>
    <div class="section-label">— BATTLE ZONE —</div>
    <div class="battle-area">
      ${game.enemies.map((e,i)=>`
        <div class="enemy-card ${i===game.targetIdx&&e.hp>0?'targeted':''} ${e.hp<=0?'':'damage-flash'}" 
             onclick="if(${e.hp}>0){game.targetIdx=${i};render()}" style="${e.hp<=0?'opacity:.3':'cursor:pointer'}">
          <div class="eemoji">${e.emoji}</div>
          <div class="ename">${e.name}</div>
          <div class="hp-bar"><div class="hp-fill" style="width:${(e.hp/e.maxHp)*100}%"></div></div>
          <div class="hp-text">${e.hp}/${e.maxHp} HP</div>
          <div class="ethreat">⚔️ ${e.atk} ATK</div>
        </div>
      `).join('')}
    </div>
    <div class="actions-bar">
      <button class="btn btn-attack" onclick="game.attackEnemy();render()" ${game.attack<=0?'disabled style="opacity:.4"':''}>⚔️ ATTACK (${game.attack})</button>
      <button class="btn" onclick="game.purgeHull();render()" ${game.credits<2||game.hullBreach<=0?'disabled style="opacity:.4"':''}>🔧 REPAIR (-2💰)</button>
      <button class="btn btn-end" onclick="game.endTurn();render()">⏭️ END TURN</button>
    </div>
    <div class="log">${game.log}</div>
    <div class="hand-section">
      <div class="hand-title">🃏 Your Hand (${game.hand.length} cards)</div>
      <div class="hand-grid">
        ${game.hand.map((c,i)=>`
          <div class="hand-card ${game.played.has(i)?'played':''}" onclick="game.playCard(${i});render()">
            <div>${c.emoji} ${c.name}</div>
            <div style="font-size:.8em;color:#5a8a6a;margin-top:2px">${c.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="market-section">
      <div class="market-title">🏪 Space Station Market</div>
      <div class="market-grid">
        ${CONFIG.market.map((c,i)=>`
          <div class="market-card ${game.credits<c.cost?'cant-buy':''}" onclick="game.buyCard(${i});render()">
            <div>${c.emoji}</div>
            <div style="font-weight:bold;color:#a0c0d0">${c.name}</div>
            <div style="color:#6a8a7a;margin:2px 0">${c.desc}</div>
            <div class="mcost">💰 ${c.cost}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
render();
</script>
</body>
</html>
