<h1>🐍 JuX SNAKE</h1>
<div class="subtitle">T H E &nbsp; S E R P E N T &nbsp; M O V E S</div>
<div class="hud">
  <div>SCORE: <span id="score">0</span></div>
  <div class="hi">HI: <span id="hiScore">0</span></div>

</div>
<canvas id="gameArea" width="400" height="400"></canvas>

  <h2>🐍</h2>
  <p>Arrow keys or swipe to move</p>

  <button class="startBtn" onclick="startGame()">ENTER THE DESERT</button>
</div>

  <div></div><button class="ctrl-btn" onclick="setDir(0,-1)">▲</button><div></div>
  <button class="ctrl-btn" onclick="setDir(-1,0)">◀</button><div></div><button class="ctrl-btn" onclick="setDir(1,0)">▶</button>
  <div></div><button class="ctrl-btn" onclick="setDir(0,1)">▼</button><div></div>
</div>

<script>
const canvas=document.getElementById('gameArea'),ctx=canvas.getContext('2d');
const CELL=20,COLS=20,ROWS=20;
let snake,dir,nextDir,food,specialFood,score,speed,gameLoop,running=false;
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();

// Prizes
const PRIZES=[
  {id:'first_bite',name:'First Bite',icon:'🌶️',desc:'Eat your first spice',check:s=>s>=1},
  {id:'ten',name:'Desert Walker',icon:'🏜️',desc:'Score 10',check:s=>s>=10},
  {id:'twenty5',name:'Spice Hunter',icon:'🔥',desc:'Score 25',check:s=>s>=25},
  {id:'fifty',name:'Sand Worm',icon:'🐛',desc:'Score 50',check:s=>s>=50},
  {id:'hundred',name:'Shai-Hulud',icon:'🪱',desc:'Score 100',check:s=>s>=100},
  {id:'speed_demon',name:'Speed Demon',icon:'⚡',desc:'Score 30+ at max speed',check:s=>s>=30&&speed<=60},
  {id:'gold_spice',name:'Golden Spice',icon:'✨',desc:'Eat a golden spice',check:()=>wonPrizes.has('gold_spice')},
  {id:'survivor',name:'Survivor',icon:'💀',desc:'Play 10 games',check:()=>getGamesPlayed()>=10},
  {id:'legend',name:'MELANGE',icon:'🍊',desc:'Score 200',check:s=>s>=200}
];
let wonPrizes=new Set(JSON.parse(localStorage.getItem('snake_prizes')||'[]'));
let hiScore=parseInt(localStorage.getItem('snake_hi')||'0');
document.getElementById('hiScore').textContent=hiScore;

function getGamesPlayed(){return parseInt(localStorage.getItem('snake_games')||'0')}
function incGamesPlayed(){const g=getGamesPlayed()+1;localStorage.setItem('snake_games',g);return g}

function renderPrizes(){
  const grid=document.getElementById('prizesGrid');
  grid.innerHTML=PRIZES.map(p=>`<div class="prize ${wonPrizes.has(p.id)?'won':''}"><span class="icon">${p.icon}</span>${p.name}<br><small>${p.desc}</small></div>`).join('');
  document.getElementById('prizeCount').textContent=wonPrizes.size;
}
renderPrizes();

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function checkPrizes(){
  PRIZES.forEach(p=>{
    if(!wonPrizes.has(p.id)&&p.check(score)){
      wonPrizes.add(p.id);localStorage.setItem('snake_prizes',JSON.stringify([...wonPrizes]));
      showToast('🏆 '+p.name+'!');playSound(800,0.15,'sine');renderPrizes();
    }
  });
}

function playSound(freq,dur,type='square'){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0.12,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}

function startGame(){
  document.getElementById('startOverlay').style.display='none';
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;speed=120;specialFood=null;
  document.getElementById('score').textContent=0;
  placeFood();
  if(gameLoop)clearInterval(gameLoop);
  gameLoop=setInterval(tick,speed);running=true;
  incGamesPlayed();checkPrizes();
  if(audioCtx.state==='suspended')audioCtx.resume();
}

function placeFood(){
  let pos;do{pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food=pos;
  // 10% chance golden spice
  if(Math.random()<0.1){specialFood=pos}else{specialFood=null}
}

function setDir(x,y){if(dir.x!==-x||dir.y!==-y)nextDir={x,y}}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp')setDir(0,-1);else if(e.key==='ArrowDown')setDir(0,1);
  else if(e.key==='ArrowLeft')setDir(-1,0);else if(e.key==='ArrowRight')setDir(1,0);
  if(!running&&(e.key===' '||e.key==='Enter'))startGame();
});

// Swipe
let tx,ty;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault()},{passive:false});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){setDir(dx>0?1:-1,0)}else{setDir(0,dy>0?1:-1)}
  e.preventDefault();
},{passive:false});

function tick(){
  dir=nextDir;
  const head={x:(snake[0].x+dir.x+COLS)%COLS,y:(snake[0].y+dir.y+ROWS)%ROWS};
  // Self collision
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    const pts=specialFood&&head.x===specialFood.x&&head.y===specialFood.y?5:1;
    score+=pts;document.getElementById('score').textContent=score;
    if(pts===5){wonPrizes.add('gold_spice');localStorage.setItem('snake_prizes',JSON.stringify([...wonPrizes]));playSound(1200,0.2,'sine')}
    else{playSound(440,0.08)}
    placeFood();checkPrizes();
    // Speed up every 5 points
    if(score%5===0&&speed>50){speed-=5;clearInterval(gameLoop);gameLoop=setInterval(tick,speed)}
  }else{snake.pop()}
  draw();
}

function draw(){
  ctx.fillStyle='#0d0d18';ctx.fillRect(0,0,canvas.width,canvas.height);
  // Grid
  ctx.strokeStyle='rgba(46,196,182,0.04)';ctx.lineWidth=0.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke()}
  for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke()}
  // Food
  if(specialFood){ctx.fillStyle='#e8a045';ctx.shadowColor='#e8a045';ctx.shadowBlur=15}
  else{ctx.fillStyle='#b42814';ctx.shadowColor='#b42814';ctx.shadowBlur=10}
  ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // Snake
  snake.forEach((s,i)=>{
    const alpha=1-i*0.015;
    ctx.fillStyle=i===0?'#2ec4b6':`rgba(46,196,182,${Math.max(alpha,0.3)})`;
    ctx.shadowColor='#2ec4b6';ctx.shadowBlur=i===0?12:4;
    ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
  });
  ctx.shadowBlur=0;
}

function gameOver(){
  clearInterval(gameLoop);running=false;
  playSound(150,0.4,'sawtooth');
  if(score>hiScore){hiScore=score;localStorage.setItem('snake_hi',hiScore);document.getElementById('hiScore').textContent=hiScore}
  checkPrizes();
  // Show restart overlay
  const ov=document.getElementById('startOverlay');
  ov.style.display='flex';
  ov.querySelector('h2').textContent='💀 SCORE: '+score;
  ov.querySelector('.startBtn').textContent='DEAL AGAIN';
}

// Responsive canvas
function resize(){
  const maxW=Math.min(window.innerWidth-40,500);
  const sz=Math.floor(maxW/COLS)*COLS;
  canvas.style.width=sz+'px';canvas.style.height=sz+'px';
}

draw();
</script>
