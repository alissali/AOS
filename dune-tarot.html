<title>DUNE TAROT — The Spice Oracle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #d4a556;
  font-family: 'Cinzel', serif;
  min-height: 100vh;
  overflow-x: hidden;
}
.sand-bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 30%, #1a1408 0%, #0d0d15 50%, #050510 100%);
  z-index: -2;
}
.stars {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: -1;
}
.star {
  position: absolute; border-radius: 50%; background: #fff;
  animation: twinkle 3s ease-in-out infinite alternate;
}
@keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 0.8; } }
@keyframes spiceGlow {
  0% { text-shadow: 0 0 20px #d4a556, 0 0 40px #b8860b; }
  50% { text-shadow: 0 0 40px #ff8c00, 0 0 80px #d4a556, 0 0 120px #8b4513; }
  100% { text-shadow: 0 0 20px #d4a556, 0 0 40px #b8860b; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes cardReveal {
  0% { transform: rotateY(180deg) scale(0.5); opacity: 0; }
  60% { transform: rotateY(0deg) scale(1.1); opacity: 1; }
  100% { transform: rotateY(0deg) scale(1); opacity: 1; }
}
@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* SCREENS */
.screen { display: none; min-height: 100vh; padding: 20px; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* TITLE SCREEN */
#title-screen { justify-content: center; text-align: center; }
#title-screen h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 3.5em; font-weight: 900;
  color: #d4a556;
  animation: spiceGlow 4s ease-in-out infinite;
  margin-bottom: 10px;
}
#title-screen h2 {
  font-size: 1.4em; color: #8b7355; letter-spacing: 6px;
  margin-bottom: 50px;
}
.oracle-eye {
  font-size: 5em; margin-bottom: 30px;
  animation: float 3s ease-in-out infinite;
}
.spread-btn {
  display: block; width: 320px; margin: 10px auto;
  padding: 18px 30px;
  background: linear-gradient(135deg, #1a1408, #2a1f10);
  border: 2px solid #d4a556;
  color: #d4a556; font-family: 'Cinzel', serif;
  font-size: 1.1em; cursor: pointer;
  transition: all 0.3s; border-radius: 4px;
}
.spread-btn:hover {
  background: linear-gradient(135deg, #2a1f10, #3a2f18);
  box-shadow: 0 0 30px rgba(212,165,86,0.4);
  transform: scale(1.05);
}
.spread-btn .spread-desc {
  font-size: 0.7em; color: #8b7355; display: block; margin-top: 4px;
}

/* CARD SELECTION SCREEN */
#select-screen { justify-content: flex-start; padding-top: 40px; }
#select-screen h2 { font-size: 1.6em; margin-bottom: 5px; animation: spiceGlow 4s ease-in-out infinite; }
#select-screen .instruction { color: #8b7355; font-size: 0.9em; margin-bottom: 25px; }
.card-pool {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 8px; max-width: 900px; margin-bottom: 30px;
}
.pool-card {
  width: 52px; height: 78px;
  background: linear-gradient(145deg, #1a1408, #0d0a04);
  border: 1.5px solid #6b5530;
  border-radius: 4px; cursor: pointer;
  transition: all 0.3s; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.pool-card::after {
  content: '☀'; color: #6b5530; font-size: 1.2em;
}
.pool-card:hover {
  border-color: #d4a556;
  box-shadow: 0 0 15px rgba(212,165,86,0.5);
  transform: translateY(-5px);
}
.pool-card.selected {
  border-color: #ff8c00;
  box-shadow: 0 0 25px rgba(255,140,0,0.6);
  background: linear-gradient(145deg, #2a1f10, #1a1408);
}
.pool-card.selected::after { content: '✦'; color: #ff8c00; }
.pool-card.used { opacity: 0.2; pointer-events: none; }

/* READING SCREEN */
#reading-screen { justify-content: flex-start; padding-top: 30px; }
.reading-title { font-size: 1.5em; margin-bottom: 25px; animation: spiceGlow 4s ease-in-out infinite; }
.spread-area {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 20px; margin-bottom: 30px; max-width: 900px;
}
.tarot-card {
  width: 150px; perspective: 1000px; cursor: pointer;

.tarot-card .card-inner {

.tarot-card.flipped .card-inner { transform: rotateY(180deg); }
.card-front, .card-back {

}
.card-front {

.card-front .card-symbol { font-size: 2.5em; margin-bottom: 8px; }

.card-back {

/* DETAIL OVERLAY */

</style>

var spreadSize = 0;
var selectedIndices = [];
var chosenCards = [];
var positionLabels = {
  1: ['The Oracle Speaks'],
  3: ['PAST', 'PRESENT', 'FUTURE'],
  5: ['SITUATION', 'CHALLENGE', 'FOUNDATION', 'FUTURE', 'OUTCOME']
};

function initStars() {
  var container = document.getElementById('stars');
  for (var i = 0; i < 80; i++) {
    var star = document.createElement('div');
    star.className = 'star';
    var size = Math.random() * 2 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = (Math.random() * 3) + 's';
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    container.appendChild(star);
  }
}

function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startSpread(n) {
  spreadSize = n;
  selectedIndices = [];
  chosenCards = [];
  document.getElementById('cards-needed').textContent = n;
  document.getElementById('select-instruction').innerHTML = 'Focus your mind. Select <strong>' + n + '</strong> card' + (n > 1 ? 's' : '') + '.';
  buildPool();
  document.getElementById('reveal-btn').style.display = 'none';
  showScreen('select-screen');
}

function buildPool() {
  var pool = document.getElementById('card-pool');
  pool.innerHTML = '';
  var indices = [];
  for (var i = 0; i < 22; i++) indices.push(i);
  // Shuffle
  for (var i = indices.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
  }
  for (var i = 0; i < 22; i++) {
    var card = document.createElement('div');
    card.className = 'pool-card';
    card.setAttribute('data-index', indices[i]);
    card.addEventListener('click', function() { selectPoolCard(this); });
    pool.appendChild(card);
  }
}

function selectPoolCard(el) {
  var idx = parseInt(el.getAttribute('data-index'));
  if (el.classList.contains('selected')) {
    el.classList.remove('selected');
    var pos = selectedIndices.indexOf(idx);
    if (pos > -1) selectedIndices.splice(pos, 1);
  } else {
    if (selectedIndices.length >= spreadSize) return;
    el.classList.add('selected');
    selectedIndices.push(idx);
  }
  document.getElementById('reveal-btn').style.display = selectedIndices.length === spreadSize ? 'inline-block' : 'none';
}

function revealCards() {
  chosenCards = [];
  for (var i = 0; i < selectedIndices.length; i++) {
    var card = JSON.parse(JSON.stringify(ARCANA[selectedIndices[i]]));
    card.isReversed = Math.random() < 0.3;
    chosenCards.push(card);
  }
  buildReading();
  showScreen('reading-screen');
}

function buildReading() {
  var area = document.getElementById('spread-area');
  area.innerHTML = '';
  document.getElementById('full-reading-area').innerHTML = '';
  document.getElementById('interpret-btn').style.display = 'inline-block';
  var labels = positionLabels[spreadSize];

  for (var i = 0; i < chosenCards.length; i++) {
    var c = chosenCards[i];
    var wrapper = document.createElement('div');
    wrapper.className = 'tarot-card';
    wrapper.setAttribute('data-idx', String(i));
    wrapper.style.animation = 'fadeUp 0.6s ease-out ' + (i * 0.3) + 's both';

    var inner = document.createElement('div');
    inner.className = 'card-inner';

    var front = document.createElement('div');
    front.className = 'card-front';
    front.innerHTML = '<div class="card-symbol">☀</div><div class="card-num">' + c.numeral + '</div>';

    var back = document.createElement('div');
    back.className = 'card-back';
    var reversedTag = c.isReversed ? '<div style="font-size:0.5em;color:#ff4444;margin-bottom:3px">⟲ REVERSED</div>' : '';
    back.innerHTML = '<div class="card-icon">' + c.icon + '</div><div class="card-name">' + c.name + '</div>' + reversedTag + '<div class="card-subtitle">' + c.subtitle + '</div><div class="card-meaning">' + c.keywords + '</div>';

    inner.appendChild(front);
    inner.appendChild(back);
    wrapper.appendChild(inner);

    var label = document.createElement('div');
    label.className = 'position-label';
    label.textContent = labels[i];
    wrapper.appendChild(label);

    wrapper.addEventListener('click', (function(index) {
      return function() {
        var w = this;
        if (!w.classList.contains('flipped')) {
          w.classList.add('flipped');
          setTimeout(function() { showDetail(index); }, 900);
        } else {
          showDetail(index);
        }
      };
    })(i));

    area.appendChild(wrapper);
  }
}

function showDetail(idx) {
  var c = chosenCards[idx];
  var labels = positionLabels[spreadSize];
  var reading = c.isReversed ? c.reversed : c.upright;
  var reversedTag = c.isReversed ? '<div style="color:#ff4444;font-size:0.9em;margin-bottom:10px">⟲ REVERSED</div>' : '<div style="color:#4aff4a;font-size:0.9em;margin-bottom:10px">△ UPRIGHT</div>';

  var html = '<div class="detail-icon">' + c.icon + '</div>';
  html += '<div class="detail-name">' + c.name + '</div>';
  html += '<div class="detail-subtitle">' + c.subtitle + '</div>';
  html += '<div class="detail-numeral">' + c.numeral + '</div>';
  html += reversedTag;
  html += '<div class="detail-position">Position: ' + labels[idx] + '</div>';
  html += '<div class="detail-reading">' + reading + '</div>';
  html += '<div class="detail-keywords">✦ ' + c.keywords + '</div>';
  html += '<button class="btn" onclick="closeDetail()">✕ CLOSE</button>';

  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-overlay').classList.add('active');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('active');
}

function showFullReading() {
  document.getElementById('interpret-btn').style.display = 'none';
  var labels = positionLabels[spreadSize];
  var area = document.getElementById('full-reading-area');

  // Flip all cards first
  var cards = document.querySelectorAll('.tarot-card');
  for (var i = 0; i < cards.length; i++) cards[i].classList.add('flipped');

  var html = '<div class="full-reading"><h3>👁 THE SPICE ORACLE SPEAKS</h3>';

  for (var i = 0; i < chosenCards.length; i++) {
    var c = chosenCards[i];
    var reading = c.isReversed ? c.reversed : c.upright;
    var state = c.isReversed ? ' (Reversed)' : '';
    html += '<div class="reading-line"><strong>' + labels[i] + ' — ' + c.icon + ' ' + c.name + state + ':</strong><br>' + reading + '</div>';
  }

  if (spreadSize === 3) {
    html += '<div class="reading-line" style="border-top:1px solid #3a2f18;padding-top:12px;margin-top:12px"><strong>☀ SYNTHESIS:</strong><br>Your past shaped the blade. Your present holds it. Your future swings it. The spice flows through all three — trust the arc of the desert. The worm knows where you\'re going even when you don\'t.</div>';
  } else if (spreadSize === 5) {
    html += '<div class="reading-line" style="border-top:1px solid #3a2f18;padding-top:12px;margin-top:12px"><strong>☀ THE GOLDEN PATH:</strong><br>Five points of the Spice Cross converge. Your situation is your terrain, your challenge is your worm, your foundation is your stillsuit, your future is the horizon, and your outcome — that\'s the water you\'ll leave behind. Walk the path. The Oracle has spoken.</div>';
  }

  html += '</div>';
  area.innerHTML = html;
  area.scrollIntoView({behavior: 'smooth'});
}

function resetAll() {
  showScreen('title-screen');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDetail();
});

initStars();
</script>
</body>
</html>
